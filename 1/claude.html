<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Claude · Spark Animation</title>
<style>
  :root {
    --clay: #D97757;
    --bg: #F0EEE6;
    --ink: #1F1E1D;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: Georgia, "Times New Roman", "Songti SC", serif;
    cursor: pointer;
    user-select: none;
  }

  svg { width: 220px; height: 220px; overflow: visible; }

  /* 光线：从中心点缩放 */
  .ray {
    stroke: var(--clay);
    stroke-width: 9;
    stroke-linecap: round;
    transform-origin: 0 0;
    transform: scale(0);
    animation: burst .8s cubic-bezier(.34, 1.56, .64, 1) forwards;
    animation-delay: var(--d);
  }
  @keyframes burst { to { transform: scale(1); } }

  /* 中心圆点 */
  .core {
    fill: var(--clay);
    transform-origin: 0 0;
    animation: pop .4s ease-out both;
  }
  @keyframes pop { from { transform: scale(0); } }

  /* 思考态 */
  .spark { transform-origin: 0 0; }
  .thinking .spark { animation: spin 14s linear infinite; }
  .thinking .ray {
    transform: scale(1);
    animation: breathe 1.8s ease-in-out infinite;
    animation-delay: var(--w);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(.5); }
  }

  /* 悬停加速 */
  body:hover .thinking .spark { animation-duration: 5s; }
  body:hover .thinking .ray   { animation-duration: .9s; }

  /* 文字 */
  h1 {
    margin-top: 36px;
    font-size: 56px;
    font-weight: 400;
    letter-spacing: -1px;
    color: var(--ink);
    opacity: 0;
    transform: translateY(16px);
    animation: rise .9s ease-out 1s forwards;
  }
  p {
    margin-top: 10px;
    font-size: 14px;
    color: #8a8780;
    letter-spacing: 2px;
    opacity: 0;
    animation: rise .9s ease-out 1.3s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<svg id="logo" viewBox="-100 -100 200 200">
  <g class="spark" id="spark"></g>
</svg>
<h1>Claude</h1>
<p>点击重播 · 悬停加速</p>

<script>
  const svg = document.getElementById('logo');
  const spark = document.getElementById('spark');
  const NS = 'http://www.w3.org/2000/svg';

  // 长短不一的光线，模拟手绘的有机感
  const lengths = [88, 72, 82, 66, 90, 70, 84, 64, 86, 74, 80, 68];
  const N = lengths.length;

  function build() {
    svg.classList.remove('thinking');
    spark.innerHTML = '';

    lengths.forEach((len, i) => {
      const angle = i * 360 / N + (i % 2 ? 4 : -3); // 轻微角度抖动
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('transform', `rotate(${angle})`);

      const line = document.createElementNS(NS, 'line');
      line.setAttribute('class', 'ray');
      line.setAttribute('x1', 0);
      line.setAttribute('y1', -14);
      line.setAttribute('x2', 0);
      line.setAttribute('y2', -len);
      line.style.setProperty('--d', `${0.2 + i * 0.05}s`); // 迸发延迟
      line.style.setProperty('--w', `${i * 0.15}s`);       // 呼吸相位

      g.appendChild(line);
      spark.appendChild(g);
    });

    const core = document.createElementNS(NS, 'circle');
    core.setAttribute('class', 'core');
    core.setAttribute('r', 12);
    spark.appendChild(core);

    setTimeout(() => svg.classList.add('thinking'), 1600);
  }

  // 点击重播（同时重置文字动画）
  document.body.addEventListener('click', () => {
    document.querySelectorAll('h1, p').forEach(el => {
      el.style.animation = 'none';
      el.offsetHeight; // 触发重排
      el.style.animation = '';
    });
    build();
  });

  build();
</script>
</body>
</html>
