<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Deople Motion Lab</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
Inter,
system-ui,
sans-serif;
}

body{
overflow:hidden;
background:#020611;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:#fff;
}

canvas{
position:fixed;
inset:0;
z-index:0;
}

.logo{
position:relative;
z-index:3;
display:flex;
gap:10px;
perspective:2000px;
}

.letter{

font-size:clamp(70px,10vw,180px);
font-weight:900;

color:#40dfff;

text-shadow:
0 0 10px #40dfff,
0 0 30px #40dfff,
0 0 80px rgba(64,223,255,.8);

transform-style:preserve-3d;
}

.panel{

position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
z-index:9;

background:
rgba(255,255,255,.06);

backdrop-filter:blur(15px);

padding:16px 28px;

border-radius:20px;

display:flex;
gap:15px;
align-items:center;
}

button{

background:#14233f;
border:none;
color:white;
padding:10px 18px;
border-radius:10px;
cursor:pointer;

}

.range{
width:140px;
}

.title{

position:fixed;
top:40px;
left:50%;
transform:translateX(-50%);
z-index:5;

font-size:22px;
letter-spacing:4px;
opacity:.8;
}

.mode{
position:fixed;
top:80px;
left:50%;
transform:translateX(-50%);
color:#40dfff;
z-index:5;
font-size:14px;
letter-spacing:3px;
}

</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="title">
DEOPLE MOTION LAB
</div>

<div class="mode" id="modeName">
MECHANICAL
</div>

<div class="logo">

<div class="letter">D</div>
<div class="letter">e</div>
<div class="letter">o</div>
<div class="letter">p</div>
<div class="letter">l</div>
<div class="letter">e</div>

</div>

<div class="panel">

<button onclick="randomMode()">
随机
</button>

<button onclick="nextMode()">
下一种
</button>

<label>速度</label>

<input
class="range"
type="range"
min="0.3"
max="3"
step="0.1"
value="1"
oninput="changeSpeed(this.value)"
>

</div>

<script>

////////////////////////////////////////////////////
//// 星空背景
////////////////////////////////////////////////////

const canvas =
document.getElementById("stars")

const ctx =
canvas.getContext("2d")

function resize(){

canvas.width =
window.innerWidth

canvas.height =
window.innerHeight

}

resize()

window.onresize=resize

const stars=[]

for(let i=0;i<300;i++){

stars.push({

x:Math.random()*innerWidth,
y:Math.random()*innerHeight,
r:Math.random()*2,
v:Math.random()*0.4

})

}

function renderStars(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
)

ctx.fillStyle="white"

stars.forEach(s=>{

ctx.beginPath()

ctx.arc(
s.x,
s.y,
s.r,
0,
Math.PI*2
)

ctx.fill()

s.y+=s.v

if(s.y>innerHeight){

s.y=-10
s.x=Math.random()*innerWidth

}

})

requestAnimationFrame(
renderStars
)

}

renderStars()

////////////////////////////////////////////////////
//// Logo Motion System
////////////////////////////////////////////////////

const letters =
document.querySelectorAll(".letter")

const modeName =
document.getElementById("modeName")

let speed=1

const modes=[

{
name:"MECHANICAL",
fn:mechanical
},

{
name:"WAVE",
fn:wave
},

{
name:"WORMHOLE",
fn:wormhole
},

{
name:"COLLISION",
fn:collision
},

{
name:"EXPLOSION",
fn:explosion
},

{
name:"GLITCH",
fn:glitch
},

{
name:"ELASTIC",
fn:elastic
},

{
name:"QUANTUM",
fn:quantum
}

]

let index=0

function animateMode(m){

modeName.innerHTML=m.name

letters.forEach(el=>{

el.getAnimations()
.forEach(a=>a.cancel())

})

m.fn()

}

function nextMode(){

index++

if(index>=modes.length)
index=0

animateMode(
modes[index]
)

}

function randomMode(){

index =
Math.floor(
Math.random()*
modes.length
)

animateMode(
modes[index]
)

}

function changeSpeed(v){

speed=parseFloat(v)

animateMode(
modes[index]
)

}

////////////////////////////////////////////////////
//// 动画库
////////////////////////////////////////////////////

function mechanical(){

letters.forEach((l,i)=>{

l.animate([

{
transform:
"translateY(-300px) rotateX(360deg)"
},

{
transform:
"translateY(0) rotateX(0deg)"
}

],{

duration:
6000/speed,

iterations:
Infinity,

delay:
i*120

})

})

}

function wave(){

letters.forEach((l,i)=>{

l.animate([

{
transform:
"translateY(0)"
},

{
transform:
"translateY(-70px)"
},

{
transform:
"translateY(0)"
}

],{

duration:
2400/speed,

iterations:
Infinity,

delay:i*150

})

})

}

function wormhole(){

letters.forEach((l,i)=>{

l.animate([

{
transform:
"translateZ(-1500px)"
},

{
transform:
"translateZ(400px)"
},

{
transform:
"translateZ(0)"
}

],{

duration:
4500/speed,

iterations:
Infinity,

delay:i*180

})

})

}

function collision(){

letters.forEach((l,i)=>{

const dir=
i<3?-1:1

l.animate([

{
transform:
`translateX(${dir*500}px)`
},

{
transform:
"translateX(0)"
},

{
transform:
`translateX(${dir*500}px)`
}

],{

duration:
5000/speed,

iterations:
Infinity

})

})

}

function explosion(){

letters.forEach(l=>{

let x=
Math.random()*1200-600

let y=
Math.random()*800-400

l.animate([

{
transform:
"scale(1)"
},

{
transform:
`translate(${x}px,${y}px)
scale(.1)`
},

{
transform:
"translate(0,0)
scale(1)"
}

],{

duration:
7000/speed,

iterations:
Infinity

})

})

}

function glitch(){

letters.forEach(l=>{

l.animate([

{
transform:
"translateX(-5px)"
},

{
transform:
"translateX(5px)"
},

{
transform:
"translateX(-3px)"
},

{
transform:
"translateX(0)"
}

],{

duration:
80,

iterations:
Infinity

})

})

}

function elastic(){

letters.forEach((l,i)=>{

l.animate([

{
transform:
"scale(1)"
},

{
transform:
"scale(1.7,.5)"
},

{
transform:
"scale(.8,1.3)"
},

{
transform:
"scale(1)"
}

],{

duration:
2500/speed,

iterations:
Infinity,

delay:i*100

})

})

}

function quantum(){

letters.forEach(l=>{

l.animate([

{
opacity:0,
transform:
"scale(0)"
},

{
opacity:1,
transform:
"scale(1.5)"
},

{
opacity:1,
transform:
"scale(1)"
}

],{

duration:
3500/speed,

iterations:
Infinity

})

})

}

////////////////////////////////////////////////////
//// 自动轮播
////////////////////////////////////////////////////

animateMode(
modes[0]
)

setInterval(
nextMode,
8000
)

</script>

</body>
</html>
