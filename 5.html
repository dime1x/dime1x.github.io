
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deople Motion Studio — 100 Animations</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090b12;color:#fff;
 font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
header{
 padding:24px 20px 18px;border-bottom:1px solid #252936;
 display:flex;align-items:center;justify-content:space-between;
}
.brand{font-size:25px;font-weight:850;letter-spacing:-2px}
.brand span:nth-child(1){color:#1685ff}
.brand span:nth-child(2){color:#ea4335}
.brand span:nth-child(3){color:#fbbc05}
.brand span:nth-child(4){color:#8b5cf6}
.brand span:nth-child(5){color:#34a853}
.brand span:nth-child(6){color:#ff6d01}
.sub{font-size:11px;color:#777}
main{max-width:1200px;margin:auto;padding:20px}
.stage{
 height:350px;background:radial-gradient(ellipse at center,#20283b 0%,#101521 48%,#0b0e16 100%);
 border:1px solid #283044;border-radius:20px;
 display:flex;align-items:center;justify-content:center;
 position:relative;overflow:hidden;
}
canvas{width:100%;height:100%;display:block}
.stage-label{
 position:absolute;bottom:16px;left:18px;
 font-size:12px;color:#a5aec1;pointer-events:none
}
.controls{
 display:flex;gap:9px;flex-wrap:wrap;margin:16px 0;
}
button,input{
 border:1px solid #30394c;background:#171d2a;
 color:white;border-radius:10px;padding:11px 15px;
 font-size:13px;cursor:pointer;
}
button:hover{background:#27344b}
button.primary{background:#1677ef;border-color:#1677ef}
input{cursor:text;flex:1;min-width:150px}
.info{
 display:flex;align-items:center;justify-content:space-between;
 gap:12px;color:#929db2;font-size:12px;margin:15px 0;
}
.progress{height:3px;background:#252c3b;border-radius:9px;overflow:hidden}
.progress div{height:100%;width:0;background:#2585ff}
.grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
 gap:9px;margin-top:18px;
}
.item{
 border:1px solid #252d3c;background:#121824;
 border-radius:11px;padding:12px;text-align:left;
 min-height:70px;cursor:pointer;
}
.item.active{border-color:#328aff;background:#182943}
.num{font-size:10px;color:#75849c;margin-bottom:6px}
.name{font-size:13px;font-weight:650}
.category{font-size:10px;color:#71809a;margin-top:5px}
footer{padding:30px;text-align:center;color:#596477;font-size:11px}
@media(max-width:600px){
 header{padding:17px}
 main{padding:12px}
 .stage{height:260px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>

<header>
 <div>
  <div class="brand">
   <span>Ð</span><span>e</span><span>o</span><span>p</span><span>l</span><span>e</span>
  </div>
  <div class="sub">MOTION STUDIO / 100 EXPERIMENTAL MOVEMENTS</div>
 </div>
 <div class="sub">DEOPLE LAB</div>
</header>

<main>
 <div class="stage">
  <canvas id="canvas"></canvas>
  <div class="stage-label" id="stageLabel">READY TO PLAY</div>
 </div>

 <div class="controls">
  <button class="primary" id="play">▶ 播放</button>
  <button id="pause">Ⅱ 暂停</button>
  <button id="replay">↻ 重播</button>
  <button id="random">✦ 随机</button>
  <input id="search" placeholder="搜索动画名称或类别…">
 </div>

 <div class="info">
  <span id="current">请选择一种动画</span>
  <span id="timer">10.0s</span>
 </div>
 <div class="progress"><div id="progress"></div></div>

 <div class="info">
  <span>100 MOTION EXPERIMENTS</span>
  <span id="count">100 款动画</span>
 </div>
 <div class="grid" id="grid"></div>
</main>

<footer>DEOPLE MOTION STUDIO · SIX LETTERS · ONE IDENTITY</footer>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const colors=["#1685ff","#ea4335","#fbbc05","#8b5cf6","#34a853","#ff6d01"];
const letters=["Ð","e","o","p","l","e"];

const categories=[
 {
  name:"机械运动",
  types:["齿轮联动","机械展开","活塞冲击","精密组装","机械摆臂",
  "齿轮传动","机械折叠","弹簧装配","机械扫描","工业变速"]
 },
 {
  name:"科技数字",
  types:["数字解码","像素重构","信号干扰","数据扫描","电流穿梭",
  "代码雨","全息投影","能量脉冲","数字裂变","光束聚合"]
 },
 {
  name:"液态变形",
  types:["液体波动","熔岩流动","水滴弹跳","流体旋涡","液态拉伸",
  "波浪传递","黏性融合","液体喷射","柔性扭曲","液态回流"]
 },
 {
  name:"粒子效果",
  types:["粒子爆发","星尘聚合","粒子龙卷风","光点扩散","粒子雨",
  "粒子喷泉","星云重组","粒子环绕","能量碎片","粒子坍缩"]
 },
 {
  name:"空间时空",
  types:["虫洞穿梭","空间折叠","时空跃迁","引力漩涡","维度切换",
  "空间坍缩","星际飞行","空间扭曲","时空回环","深空坠落"]
 },
 {
  name:"弹性物理",
  types:["弹簧回弹","橡胶拉伸","重力坠落","弹性碰撞","钟摆运动",
  "惯性滑行","波浪弹跳","连续反弹","弹性扭转","阻尼震荡"]
 },
 {
  name:"3D立体",
  types:["三维翻转","立体旋转","透视展开","空间翻面","立体分层",
  "立体翻滚","轴心旋转","三维螺旋","透视坠落","立体重组"]
 },
 {
  name:"光影运动",
  types:["霓虹闪烁","激光扫描","光影追踪","光环扩散","光线切割",
  "极光流动","光影呼吸","光束交错","能量照射","光影聚焦"]
 },
 {
  name:"轨迹运动",
  types:["圆周轨道","螺旋上升","抛物线飞行","交错轨迹","波形轨迹",
  "椭圆环绕","折线穿梭","S形运动","轨道交汇","环形散射"]
 },
 {
  name:"创意混合",
  types:["超新星爆发","黑洞引力","宇宙心跳","风暴聚合","时空碎片",
  "能量共振","星际裂变","维度爆破","光速重生","终极进化"]
 }
];

const modes=[];
categories.forEach((cat,ci)=>{
 cat.types.forEach((name,vi)=>{
  modes.push({
   id:ci*10+vi,
   name,
   category:cat.name,
   family:ci,
   variation:vi
  });
 });
});

let selected=null;
let playing=false;
let startTime=0;
let elapsed=0;
let raf=0;
const DURATION=10000;

function resize(){
 const r=canvas.getBoundingClientRect();
 const d=Math.min(window.devicePixelRatio||1,2);
 canvas.width=r.width*d;
 canvas.height=r.height*d;
 ctx.setTransform(d,0,0,d,0,0);
}
window.addEventListener("resize",resize);
resize();

function clamp(x,a=0,b=1){return Math.max(a,Math.min(b,x))}
function smooth(x){x=clamp(x);return x*x*(3-2*x)}
function wave(x){return Math.sin(x*Math.PI*2)}
function ease(x){return 1-Math.pow(1-clamp(x),3)}
function mix(a,b,t){return a+(b-a)*t}

function stageValue(t){
 // 十秒内划分为八个运动阶段
 const p=t*8;
 return {index:Math.floor(p),local:p%1};
}

// 每个字母具有独立的时间偏移
function getMotion(mode,i,t){
 const v=mode.variation;
 const f=mode.family;
 const seed=i*1.17+v*.73;
 const delay=i*.055;
 const tt=clamp((t-delay*.12)/.94);
 const phase=tt*Math.PI*2;
 const strength=.75+v*.055;
 let x=0,y=0,rot=0,sx=1,sy=1,alpha=1,depth=0;
 const s=wave(phase+seed);
 const c=Math.cos(phase+seed);
 const pulse=.5+.5*Math.sin(phase*2+seed);

 switch(f){

 // 0 机械：独立转轴、分段动作、错峰装配
 case 0:{
  const spin=phase*(1+v*.16);
  const dir=i%2?1:-1;
  const open=smooth((tt-.08)*2.5);
  const close=smooth((tt-.72)*3.5);
  rot=dir*spin*.5+dir*(open-close)*.9;
  x=dir*(1-close)*22*Math.sin(phase*1.3+seed);
  y=Math.sin(phase*2+seed)*9;
  sx=1+Math.sin(phase*3+seed)*.08;
  sy=1+Math.cos(phase*3+seed)*.08;
  break;
 }

 // 1 数字：离散跳动、信号错位、扫描
 case 1:{
  const glitch=Math.sin(phase*9+seed);
  const burst=pulse>.83?1:0;
  x=glitch*(4+v*1.2)*burst+Math.sin(phase*4+seed)*7;
  y=Math.sin(phase*7+seed)*5;
  rot=Math.sin(phase*5+seed)*.12;
  sx=1+Math.sin(phase*8+seed)*.12;
  sy=1-Math.sin(phase*8+seed)*.09;
  alpha=.72+.28*Math.abs(Math.sin(phase*3+seed));
  break;
 }

 // 2 液态：连续波形、拉伸、错位回流
 case 2:{
  x=Math.sin(phase*.8+i*.9)*24*strength;
  y=Math.sin(phase*1.5+i*.6)*18;
  rot=Math.sin(phase+seed)*.24;
  sx=1+Math.sin(phase*1.4+seed)*.2;
  sy=1-Math.sin(phase*1.4+seed)*.15;
  break;
 }

 // 3 粒子：爆发、扩散、聚合
 case 3:{
  const burst=smooth(tt*2.2);
  const gather=smooth((tt-.48)*2);
  const amount=1-gather;
  const angle=i*1.8+v*.7;
  const radius=(30+v*4)*burst*amount;
  x=Math.cos(angle)*radius+Math.sin(phase+seed)*8;
  y=Math.sin(angle)*radius+Math.cos(phase*1.3+seed)*8;
  rot=wave(phase+seed)*.5*amount;
  sx=1+amount*.2;
  sy=1+amount*.2;
  alpha=1-.35*amount;
  break;
 }

 // 4 空间：透视深度、环绕和跃迁
 case 4:{
  const z=Math.sin(phase*.7+seed);
  depth=z;
  const a=phase+seed;
  x=Math.cos(a)*(24+v*3);
  y=Math.sin(a*1.3)*22;
  rot=a*.18;
  sx=1+z*.28;
  sy=1+z*.28;
  break;
 }

 // 5 弹性：惯性、回弹、阻尼
 case 5:{
  const b=Math.sin(phase*1.5+seed)*Math.exp(-tt*.35);
  const hit=Math.pow(Math.abs(Math.sin(phase*2+seed)),8);
  x=Math.sin(phase+seed)*25;
  y=-Math.abs(b)*25+hit*12;
  rot=b*.45;
  sx=1+hit*.22;
  sy=1-hit*.18;
  break;
 }

 // 6 3D：透视、翻面、立体旋转
 case 6:{
  const angle=phase*(.8+v*.08)+seed;
  const perspective=Math.cos(angle);
  sx=Math.max(.08,Math.abs(perspective));
  sy=.85+.15*Math.cos(angle*2);
  rot=Math.sin(angle)*.7;
  x=Math.sin(angle)*34;
  y=Math.sin(angle*2)*15;
  depth=perspective;
  break;
 }

 // 7 光影：光束扫过、闪耀、呼吸
 case 7:{
  const scan=Math.sin(phase*1.2+seed);
  x=scan*15;
  y=Math.cos(phase*2+seed)*8;
  rot=scan*.16;
  sx=1+Math.abs(scan)*.18;
  sy=1+Math.abs(scan)*.12;
  alpha=.65+.35*pulse;
  break;
 }

 // 8 轨迹：每个字母走独立轨道
 case 8:{
  const a=phase*(1+i*.07)+seed;
  const rx=20+v*3+i*2;
  const ry=12+v*2+i;
  x=Math.cos(a)*rx;
  y=Math.sin(a)*ry;
  rot=a*.3;
  sx=1+Math.sin(a)*.12;
  sy=1+Math.cos(a)*.12;
  break;
 }

 // 9 混合：爆发、旋转、回归、共振
 case 9:{
  const burst=smooth(tt*2);
  const returnBack=smooth((tt-.58)*2.4);
  const amount=burst*(1-returnBack);
  const a=i*1.3+phase*(1+v*.1);
  x=Math.cos(a)*(20+v*3)*amount+Math.sin(phase+seed)*10;
  y=Math.sin(a)*(22+v*2)*amount+Math.cos(phase*2+seed)*8;
  rot=Math.sin(phase*2+seed)*.55;
  sx=1+amount*.3;
  sy=1-amount*.12;
  alpha=1-.12*amount;
  break;
 }
 }

 // 每种模式再增加不同的细微编排
 const variationFactor=1+v*.035;
 x*=variationFactor;
 y*=variationFactor;

 return {x,y,rot,sx,sy,alpha,depth};
}

function drawBackground(w,h,t){
 ctx.clearRect(0,0,w,h);
 ctx.save();
 ctx.globalAlpha=.17;
 ctx.strokeStyle="#53627e";
 ctx.lineWidth=1;
 const gap=40;
 for(let x=0;x<w;x+=gap){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
 }
 for(let y=0;y<h;y+=gap){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
 }
 ctx.restore();

 // 背景光环
 const cx=w/2,cy=h/2;
 ctx.save();
 ctx.translate(cx,cy);
 for(let k=0;k<3;k++){
  ctx.beginPath();
  ctx.ellipse(0,0,100+k*45,35+k*17,t*.1+k*.4,0,Math.PI*2);
  ctx.strokeStyle="rgba(80,145,255,.10)";
  ctx.stroke();
 }
 ctx.restore();
}

function draw(t){
 const w=canvas.clientWidth;
 const h=canvas.clientHeight;
 drawBackground(w,h,t);

 if(!selected){
  ctx.save();
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.font="800 70px Arial";
  letters.forEach((letter,i)=>{
   ctx.fillStyle=colors[i];
   ctx.fillText(letter,w/2+(i-2.5)*53,h/2);
  });
  ctx.restore();
  return;
 }

 const center=w/2;
 const cy=h/2;
 const spacing=Math.min(66,w/8.2);
 const total=(letters.length-1)*spacing;
 const start=center-total/2;
 const elapsedSeconds=t*10;
 const phaseInfo=stageValue(t);

 // 运动光环
 if(selected.family===3||selected.family===4||selected.family===9){
  ctx.save();
  ctx.translate(center,cy);
  ctx.strokeStyle="rgba(76,151,255,.18)";
  ctx.lineWidth=1;
  const r=45+Math.sin(t*20)*7;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
  ctx.restore();
 }

 letters.forEach((letter,i)=>{
  const m=getMotion(selected,i,t);
  const x=start+i*spacing+m.x;
  const y=cy+m.y;

  ctx.save();
  ctx.translate(x,y);

  // 伪3D透视
  const perspective=1+Math.max(-.3,m.depth*.12);
  ctx.scale(m.sx*perspective,m.sy*perspective);
  ctx.rotate(m.rot);

  ctx.globalAlpha=m.alpha;

  // 字母阴影
  ctx.shadowColor=colors[i];
  ctx.shadowBlur=selected.family===7?24:12;

  ctx.font="850 70px Arial, sans-serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle=colors[i];
  ctx.fillText(letter,0,0);

  // 科技扫描高光
  if(selected.family===1||selected.family===7){
   ctx.shadowBlur=0;
   ctx.globalAlpha=.45;
   ctx.fillStyle="#ffffff";
   ctx.fillRect(-18,-2,36,2);
  }

  // 粒子运动装饰
  if(selected.family===3||selected.family===9){
   ctx.shadowBlur=0;
   for(let p=0;p<4;p++){
    const a=t*9+p*1.57+i;
    const radius=27+p*7;
    ctx.globalAlpha=.55;
    ctx.fillStyle=colors[i];
    ctx.beginPath();
    ctx.arc(Math.cos(a)*radius,Math.sin(a)*radius,1.7,0,Math.PI*2);
    ctx.fill();
   }
  }

  // 机械轨道装饰
  if(selected.family===0){
   ctx.shadowBlur=0;
   ctx.strokeStyle="rgba(150,180,220,.35)";
   ctx.lineWidth=1;
   ctx.beginPath();
   ctx.arc(0,0,34,0,Math.PI*2);
   ctx.stroke();
  }

  ctx.restore();
 });

 // 8阶段标记
 ctx.save();
 ctx.fillStyle="#8292ad";
 ctx.font="11px Arial";
 ctx.textAlign="center";
 ctx.fillText("MOVEMENT PHASE "+(phaseInfo.index+1)+" / 8",center,h-28);
 ctx.restore();
}

function frame(now){
 if(!playing)return;
 elapsed=now-startTime;
 const t=clamp(elapsed/DURATION);
 draw(t);
 document.getElementById("progress").style.width=(t*100)+"%";
 document.getElementById("timer").textContent=(10-t*10).toFixed(1)+"s";

 if(t>=1){
  playing=false;
  elapsed=0;
  draw(0);
  document.getElementById("stageLabel").textContent="ANIMATION COMPLETED";
  document.getElementById("timer").textContent="0.0s";
  return;
 }
 raf=requestAnimationFrame(frame);
}

function play(){
 if(!selected)selectMode(modes[0]);
 if(playing)return;
 playing=true;
 startTime=performance.now()-elapsed;
 document.getElementById("stageLabel").textContent=
 selected.name+" · "+selected.category;
 raf=requestAnimationFrame(frame);
}

function pause(){
 if(!playing)return;
 playing=false;
 cancelAnimationFrame(raf);
 document.getElementById("stageLabel").textContent="PAUSED";
}

function replay(){
 pause();
 elapsed=0;
 document.getElementById("progress").style.width="0%";
 document.getElementById("timer").textContent="10.0s";
 play();
}

function selectMode(mode){
 pause();
 selected=mode;
 elapsed=0;
 document.getElementById("current").textContent=
 String(mode.id+1).padStart(3,"0")+" · "+mode.name+" / "+mode.category;
 document.getElementById("stageLabel").textContent=mode.name;
 document.querySelectorAll(".item").forEach(el=>{
  el.classList.toggle("active",Number(el.dataset.id)===mode.id);
 });
 draw(0);
 play();
}

function renderGrid(filter=""){
 const grid=document.getElementById("grid");
 grid.innerHTML="";
 const result=modes.filter(m=>
  (m.name+m.category).toLowerCase().includes(filter.toLowerCase())
 );
 result.forEach(m=>{
  const el=document.createElement("button");
  el.className="item"+(selected&&selected.id===m.id?" active":"");
  el.dataset.id=m.id;
  el.innerHTML=
   `<div class="num">MOTION ${String(m.id+1).padStart(3,"0")}</div>
    <div class="name">${m.name}</div>
    <div class="category">${m.category}</div>`;
  el.addEventListener("click",()=>selectMode(m));
  grid.appendChild(el);
 });
 document.getElementById("count").textContent=result.length+" 款动画";
}

document.getElementById("play").onclick=play;
document.getElementById("pause").onclick=pause;
document.getElementById("replay").onclick=replay;
document.getElementById("random").onclick=()=>{
 selectMode(modes[Math.floor(Math.random()*modes.length)]);
};
document.getElementById("search").addEventListener("input",e=>{
 renderGrid(e.target.value);
});

renderGrid();
draw(0);
</script>
</body>
</html>
