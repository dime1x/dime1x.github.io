<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Gemini  News</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 20px; }
    .news-item { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; }
    .news-item img { max-width: 200px; float: left; margin-right: 15px; border-radius: 5px; }
    .news-item h2 { margin: 0; font-size: 20px; }
    .news-item a { text-decoration: none; color: #0078d7; }
    .news-item p { margin-top: 10px; }

.container {
  width: 80%; /* 页面内容宽度 */
  max-width: 1200px; /* 最大宽度 */
  margin: 20px auto;
}


  </style>
</head>
<body>
<div class="container">
  <h1>Gemini News </h1>
  <div id="rss-feed"></div>

  <script>
    async function loadRSS() {
      const rssUrl = "https://www.google.com/alerts/feeds/10619545482363893166/11972490582003260598"; // Yahoo RSS源
      const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`);
      const data = await response.json();

      const container = document.getElementById("rss-feed");
      data.items.forEach(item => {
        // 尝试不同字段获取图片
        let imgSrc = item.enclosure?.link || item.thumbnail || null;

        // 如果还没有，尝试从 content 中提取第一张 <img>
        if (!imgSrc && item.content) {
          const match = item.content.match(/<img[^>]+src="([^">]+)"/i);
          if (match) {
            imgSrc = match[1];
          }
        }

        const div = document.createElement("div");
        div.className = "news-item";
        div.innerHTML = `

          <h2><a href="${item.link}" target="_blank">${item.title}</a></h2>
          <p>${item.description}</p>
        `;
        container.appendChild(div);
      });
    }
    loadRSS();
  </script>


<footer id="globalfooter" class="mgn-footer " style="text-align: center;">

	</div>
</footer>
  </div>
</body>
</html>
