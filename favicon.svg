<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <style>
    .bg-red { fill: #FF3B30; }
    .icon-white { fill: #FFFFFF; }
    .circle-soft { fill: rgba(255, 255, 255, 0.25); }
  </style>

  <!-- 全屏满版红色背景（无圆角，填满整个正方形） -->
  <rect width="500" height="500" class="bg-red" />

  <!-- 中央背景半透明白色圆形 -->
  <circle cx="260" cy="232" r="45" class="circle-soft" />

  <!-- 中央字母 'Đ' -->
  <g class="icon-white">
    <path d="M 205,140 H 255 C 305,140 335,175 335,232 C 335,289 305,324 255,324 H 205 Z M 219,154 V 310 H 255 C 295,310 321,280 321,232 C 321,184 295,154 255,154 Z" />
    <rect x="188" y="224" width="72" height="15" rx="2" />
  </g>

  <!-- 底部装饰圆点 -->
  <circle cx="250" cy="389" r="8" class="icon-white" />
  <circle cx="230" cy="389" r="4" class="icon-white" />
  <circle cx="270" cy="389" r="4" class="icon-white" />

  <!-- 桂冠花环（右侧，通过 transform 镜像生成左侧） -->
  <g id="laurel-wreath">
    <g class="icon-white" id="right-side">
      <path d="M 305 92 C 315 80 340 82 348 85 C 342 97 325 108 305 92 Z" />
      <path d="M 336 102 C 352 95 372 103 381 112 C 367 121 345 120 336 102 Z" />
      <path d="M 353 145 C 370 135 391 140 401 148 C 388 160 367 161 353 145 Z" />
      <path d="M 319 157 C 330 142 355 141 364 143 C 361 157 344 170 319 157 Z" />
      <path d="M 363 203 C 382 191 403 194 413 201 C 402 215 380 219 363 203 Z" />
      <path d="M 334 213 C 343 197 368 193 378 194 C 377 209 361 223 334 213 Z" />
      <path d="M 363 261 C 382 250 403 251 414 258 C 404 272 383 277 363 261 Z" />
      <path d="M 336 268 C 343 251 368 245 378 245 C 378 260 363 275 336 268 Z" />
      <path d="M 353 318 C 371 308 391 307 403 312 C 395 328 375 334 353 318 Z" />
      <path d="M 326 322 C 331 305 355 296 366 295 C 368 310 354 326 326 322 Z" />
      <path d="M 328 368 C 344 358 365 354 377 357 C 371 372 351 381 328 368 Z" />
      <path d="M 303 365 C 305 348 327 337 337 334 C 342 349 330 366 303 365 Z" />
      <path d="M 288 398 C 301 391 322 383 335 383 C 332 399 313 408 288 398 Z" />
    </g>
    <use href="#right-side" transform="translate(500, 0) scale(-1, 1)" />
  </g>
</svg>