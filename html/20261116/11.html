<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deople — Logo Motion Lab</title>
  <style>
    :root {
      --bg: #0a0b12;
      --panel: #11131d;
      --text: #f5f6ff;
      --muted: #8e92a8;
      --line: rgba(255,255,255,.1);

      /* 品牌色：可替换为 Deople 的实际品牌色 */
      --brand-a: #7772ff;
      --brand-b: #38d8ff;
      --accent: var(--brand-a);
      --glow: var(--brand-b);
      --duration: 8s;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% -20%, rgba(119,114,255,.18), transparent 55%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button, input { font: inherit; }

    .app {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .eyebrow {
      color: var(--brand-b);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 8px;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: -.055em;
    }

    .intro {
      max-width: 650px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .count {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 13px;
      color: #d7d9e8;
      background: rgba(255,255,255,.04);
      font-size: 12px;
    }

    .workspace {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
      box-shadow: 0 24px 80px rgba(0,0,0,.28);
    }

    .stage {
      --accent: var(--brand-a);
      --glow: var(--brand-b);
      position: relative;
      display: grid;
      min-height: 390px;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 55%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 47%),
        linear-gradient(135deg, #10121e, #0b0c14 70%);
    }

    .stage::before,
    .stage::after {
      position: absolute;
      z-index: -1;
      content: "";
      pointer-events: none;
    }

    .stage::before {
      inset: -50%;
      opacity: .35;
      background:
        radial-gradient(circle, transparent 0 2px, rgba(255,255,255,.16) 2.5px, transparent 3px);
      background-size: 42px 42px;
      mask-image: linear-gradient(transparent, black 35%, transparent 90%);
      animation: starDrift 18s linear infinite;
    }

    .stage::after {
      width: min(74vw, 720px);
      aspect-ratio: 1;
      border: 1px solid color-mix(in srgb, var(--glow) 18%, transparent);
      border-radius: 50%;
      box-shadow:
        0 0 0 48px rgba(255,255,255,.012),
        0 0 0 96px rgba(255,255,255,.009),
        inset 0 0 60px rgba(119,114,255,.05);
      opacity: .7;
    }

    @keyframes starDrift {
      to { transform: translate3d(42px, 42px, 0); }
    }

    .word {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      color: transparent;
      font-size: clamp(60px, 13vw, 150px);
      font-weight: 850;
      line-height: 1;
      letter-spacing: -.075em;
      white-space: nowrap;
      perspective: 700px;
      background: linear-gradient(115deg, var(--accent), var(--glow));
      background-clip: text;
      -webkit-background-clip: text;
      filter: drop-shadow(0 0 20px color-mix(in srgb, var(--accent) 38%, transparent));
      transform-style: preserve-3d;
    }

    .letter {
      display: inline-block;
      transform-origin: 50% 55%;
      will-change: transform, opacity, filter;
      animation-duration: var(--duration);
      animation-timing-function: cubic-bezier(.65, 0, .25, 1);
      animation-fill-mode: both;
      animation-iteration-count: infinite;
      animation-delay: calc(var(--i) * -0.13s);
    }

    .word.grouped .letter { animation-name: none !important; }

    .word.grouped {
      animation-duration: var(--duration);
      animation-timing-function: cubic-bezier(.65, 0, .25, 1);
      animation-fill-mode: both;
      animation-iteration-count: infinite;
    }

    .stage-info {
      position: absolute;
      right: 18px;
      bottom: 17px;
      left: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #85899f;
      font-size: 11px;
      letter-spacing: .06em;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .live::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--glow);
      box-shadow: 0 0 12px var(--glow);
      content: "";
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 15px 18px;
      border-top: 1px solid var(--line);
      background: rgba(7,8,14,.48);
    }

    .btn {
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      background: rgba(255,255,255,.045);
      cursor: pointer;
      transition: .18s ease;
    }

    .btn:hover {
      border-color: rgba(255,255,255,.28);
      background: rgba(255,255,255,.09);
      transform: translateY(-1px);
    }

    .btn.primary {
      border-color: transparent;
      color: #0a0b12;
      background: linear-gradient(110deg, var(--brand-b), #a5f4ff);
      font-weight: 750;
    }

    .btn.active {
      border-color: color-mix(in srgb, var(--brand-a) 70%, white);
      background: rgba(119,114,255,.16);
    }

    .control-spacer { flex: 1; }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 12px;
    }

    input[type="range"] {
      width: 110px;
      accent-color: var(--brand-b);
    }

    .speed-value {
      width: 34px;
      color: #e6e8f4;
      font-variant-numeric: tabular-nums;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #c6c8d7;
      font-size: 12px;
      cursor: pointer;
    }

    .toggle input { accent-color: var(--brand-a); }

    .library-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 30px 0 14px;
    }

    .library-head h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -.02em;
    }

    .library-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      min-height: 82px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      text-align: left;
      background: rgba(255,255,255,.025);
      cursor: pointer;
      transition: .18s ease;
    }

    .card:hover {
      border-color: rgba(255,255,255,.28);
      background: rgba(255,255,255,.055);
    }

    .card.selected {
      border-color: var(--brand-a);
      box-shadow: inset 0 0 0 1px rgba(119,114,255,.25);
      background: rgba(119,114,255,.09);
    }

    .card-index {
      display: block;
      margin-bottom: 8px;
      color: var(--brand-b);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .1em;
    }

    .card-title { font-size: 13px; font-weight: 650; }
    .card-category { margin-left: 6px; color: var(--muted); font-size: 11px; }

    /* 12 种运动家族；每个家族有 3 款配色/节奏变体，共 36 款 */

    .f-mechanical .letter, .f-mechanical.grouped { animation-name: mechanical; }
    @keyframes mechanical {
      0%, 8% { transform: translateY(-40px) rotateX(90deg); opacity: 0; }
      16%, 70% { transform: translateY(0) rotateX(0); opacity: 1; }
      24% { transform: translateY(-9px) rotateX(-8deg); }
      31% { transform: translateY(0) rotateX(0); }
      82% { transform: translateY(0) rotateX(0); opacity: 1; }
      100% { transform: translateY(38px) rotateX(-90deg); opacity: 0; }
    }

    .f-pulse .letter, .f-pulse.grouped { animation-name: pulse; }
    @keyframes pulse {
      0%, 10%, 100% { transform: scale(.65); opacity: 0; filter: blur(8px); }
      20%, 72% { transform: scale(1); opacity: 1; filter: blur(0); }
      35% { transform: scale(1.13); }
      45% { transform: scale(.96); }
      54% { transform: scale(1.03); }
      65% { transform: scale(1); }
      84% { transform: scale(1.4); opacity: .7; filter: blur(3px); }
    }

    .f-liquid .letter, .f-liquid.grouped { animation-name: liquid; }
    @keyframes liquid {
      0%, 12%, 100% { transform: translateY(30px) scaleX(.55) scaleY(1.35); opacity: 0; filter: blur(8px); }
      24%, 70% { transform: translateY(0) scaleX(1) scaleY(1); opacity: 1; filter: blur(0); }
      37% { transform: translateY(-12px) scaleX(1.18) scaleY(.86); }
      49% { transform: translateY(2px) scaleX(.92) scaleY(1.08); }
      60% { transform: translateY(0) scale(1); }
      84% { transform: translateY(-22px) scaleX(1.4) scaleY(.65); opacity: .4; filter: blur(5px); }
    }

    .f-particles .letter, .f-particles.grouped { animation-name: particles; }
    @keyframes particles {
      0%, 12%, 100% { transform: translate(var(--x), var(--y)) scale(.15) rotate(100deg); opacity: 0; filter: blur(4px); }
      25%, 70% { transform: translate(0,0) scale(1) rotate(0); opacity: 1; filter: blur(0); }
      42% { transform: translate(0,-8px) scale(1.08); }
      55% { transform: translate(0,0) scale(1); }
      83% { transform: translate(calc(var(--x) * 1.3), calc(var(--y) * 1.3)) scale(.2) rotate(-80deg); opacity: 0; }
    }
    .f-particles .letter:nth-child(odd) { --x: -55px; --y: -46px; }
    .f-particles .letter:nth-child(even) { --x: 55px; --y: 46px; }

    .f-warp .letter, .f-warp.grouped { animation-name: warp; }
    @keyframes warp {
      0%, 13%, 100% { transform: translateZ(-300px) scaleX(2.2); opacity: 0; filter: blur(12px); }
      25%, 70% { transform: translateZ(0) scaleX(1); opacity: 1; filter: blur(0); }
      42% { transform: translateZ(90px) scale(1.12); }
      52% { transform: translateZ(0) scale(1); }
      83% { transform: translateZ(300px) scaleX(.4); opacity: 0; filter: blur(10px); }
    }

    .f-elastic .letter, .f-elastic.grouped { animation-name: elastic; }
    @keyframes elastic {
      0%, 10%, 100% { transform: scale(.2, 1.8) translateY(35px); opacity: 0; }
      23%, 70% { transform: scale(1); opacity: 1; }
      32% { transform: scale(1.35, .72); }
      40% { transform: scale(.8, 1.2); }
      48% { transform: scale(1.12, .9); }
      55% { transform: scale(.96, 1.04); }
      63% { transform: scale(1); }
      84% { transform: scale(1.6, .35); opacity: 0; }
    }

    .f-flip .letter, .f-flip.grouped { animation-name: flip; }
    @keyframes flip {
      0%, 12%, 100% { transform: rotateY(180deg) rotateX(35deg) scale(.7); opacity: 0; }
      24%, 70% { transform: rotateY(0) rotateX(0) scale(1); opacity: 1; }
      42% { transform: rotateY(360deg) rotateX(10deg); }
      52% { transform: rotateY(360deg) rotateX(0); }
      84% { transform: rotateY(-180deg) scale(.7); opacity: 0; }
    }

    .f-glitch .letter, .f-glitch.grouped { animation-name: glitch; }
    @keyframes glitch {
      0%, 10%, 100% { transform: translateX(30px); opacity: 0; filter: blur(5px); }
      20%, 70% { transform: translateX(0); opacity: 1; filter: none; }
      33% { transform: translateX(-5px) skewX(12deg); text-shadow: 5px 0 var(--glow); }
      35% { transform: translateX(4px) skewX(-12deg); text-shadow: -5px 0 var(--accent); }
      37%, 58% { transform: translateX(0) skewX(0); text-shadow: none; }
      62% { transform: translateX(-3px); }
      84% { transform: translateX(-30px); opacity: 0; filter: blur(5px); }
    }

    .f-orbit .letter, .f-orbit.grouped { animation-name: orbit; }
    @keyframes orbit {
      0%, 12%, 100% { transform: translateY(45px) rotate(-35deg) scale(.5); opacity: 0; }
      24%, 70% { transform: translateY(0) rotate(0) scale(1); opacity: 1; }
      40% { transform: translateY(-16px) rotate(8deg) scale(1.05); }
      54% { transform: translateY(0) rotate(0) scale(1); }
      84% { transform: translateY(-45px) rotate(35deg) scale(.5); opacity: 0; }
    }

    .f-reveal .letter, .f-reveal.grouped { animation-name: reveal; }
    @keyframes reveal {
      0%, 12%, 100% { transform: translateY(55px); opacity: 0; clip-path: inset(100% 0 0); }
      25%, 70% { transform: translateY(0); opacity: 1; clip-path: inset(0); }
      42% { transform: translateY(-7px); }
      55% { transform: translateY(0); }
      84% { transform: translateY(-45px); opacity: 0; clip-path: inset(0 0 100%); }
    }

    .f-wave .letter, .f-wave.grouped { animation-name: wave; }
    @keyframes wave {
      0%, 10%, 100% { transform: translateY(40px) rotate(12deg); opacity: 0; }
      22%, 70% { transform: translateY(0) rotate(0); opacity: 1; }
      34% { transform: translateY(-22px) rotate(-4deg); }
      46% { transform: translateY(0) rotate(0); }
      56% { transform: translateY(-9px); }
      64% { transform: translateY(0); }
      84% { transform: translateY(40px) rotate(-12deg); opacity: 0; }
    }

    .f-neon .letter, .f-neon.grouped { animation-name: neon; }
    @keyframes neon {
      0%, 12%, 100% { transform: scale(.85); opacity: 0; filter: brightness(2) blur(8px); }
      24%, 70% { transform: scale(1); opacity: 1; filter: brightness(1.2) blur(0); }
      33%, 37%, 45%, 49% { opacity: .55; filter: brightness(1.8) blur(1px); }
      35%, 42%, 48%, 58% { opacity: 1; filter: brightness(1.2) blur(0); }
      84% { transform: scale(1.15); opacity: 0; filter: brightness(2) blur(8px); }
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stage { min-height: 300px; }
      .controls { gap: 8px; }
      .control-spacer { display: none; }
      .speed-control { margin-left: auto; }
    }

    @media (max-width: 440px) {
      .app { width: min(100% - 24px, 1180px); padding-top: 24px; }
      header { display: block; }
      .count { display: inline-block; margin-top: 14px; }
      .stage { min-height: 250px; }
      .controls .btn { padding: 0 10px; }
      .speed-control { width: 100%; margin: 4px 0 0; }
      input[type="range"] { flex: 1; }
      .stage-info { font-size: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">Deople / Motion Experiments</div>
        <h1>Logo Motion Lab</h1>
        <p class="intro">
          一个探索 Deople 字标运动语言的实验空间。浏览机械、粒子、空间、液态、
          霓虹等不同方向，并在独立字母与整体联动之间切换。
        </p>
      </div>
      <div class="count"><span id="currentCount">01</span> / 36 EXPERIMENTS</div>
    </header>

    <section class="workspace" aria-label="Logo 动效预览">
      <div class="stage" id="stage">
        <div class="word f-mechanical" id="word" aria-label="Deople">
          <span class="letter" style="--i:0">D</span>
          <span class="letter" style="--i:1">e</span>
          <span class="letter" style="--i:2">o</span>
          <span class="letter" style="--i:3">p</span>
          <span class="letter" style="--i:4">l</span>
          <span class="letter" style="--i:5">e</span>
        </div>
        <div class="stage-info">
          <span class="live" id="liveLabel">NOW PLAYING</span>
          <span>8 SECOND LOOP · DEOPLE</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="prevBtn" aria-label="上一个动效">← 上一个</button>
        <button class="btn primary" id="playBtn">❚❚ 暂停</button>
        <button class="btn" id="nextBtn">下一个 →</button>
        <button class="btn" id="randomBtn">⤨ 随机播放</button>

        <span class="control-spacer"></span>

        <label class="toggle">
          <input type="checkbox" id="groupToggle">
          六字整体联动
        </label>

        <label class="speed-control">
          速度
          <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
          <span class="speed-value" id="speedValue">1.0×</span>
        </label>
      </div>
    </section>

    <section class="library">
      <div class="library-head">
        <div>
          <h2>动效实验库</h2>
          <p>选择任意实验立即预览；开启自动浏览可连续体验。</p>
        </div>
        <button class="btn" id="autoBtn">▶ 连续浏览：关</button>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <script>
    const families = [
      { key: "mechanical", name: "机械咬合", category: "机械感" },
      { key: "pulse",      name: "能量脉冲", category: "科技感" },
      { key: "liquid",     name: "液态凝聚", category: "液态变形" },
      { key: "particles",  name: "粒子爆散", category: "粒子效果" },
      { key: "warp",       name: "空间穿梭", category: "未来感" },
      { key: "elastic",    name: "弹性回弹", category: "弹性运动" },
      { key: "flip",       name: "立体翻转", category: "3D 运动" },
      { key: "glitch",     name: "信号故障", category: "数字故障" },
      { key: "orbit",      name: "轨道交错", category: "空间运动" },
      { key: "reveal",     name: "切片揭示", category: "几何构成" },
      { key: "wave",       name: "波浪接力", category: "字母编排" },
      { key: "neon",       name: "霓虹闪烁", category: "光效实验" }
    ];

    const variants = [
      { name: "原生蓝紫", a: "#7772ff", b: "#38d8ff" },
      { name: "熔岩橙红", a: "#ff5b56", b: "#ffcf5c" },
      { name: "电光青绿", a: "#21e6c1", b: "#64a8ff" }
    ];

    const experiments = families.flatMap((family, familyIndex) =>
      variants.map((variant, variantIndex) => ({
        ...family,
        title: variantIndex === 0 ? family.name : `${family.name} · ${variant.name}`,
        accent: variant.a,
        glow: variant.b,
        id: familyIndex * 3 + variantIndex
      }))
    );

    const word = document.getElementById("word");
    const stage = document.getElementById("stage");
    const grid = document.getElementById("grid");
    const speed = document.getElementById("speed");
    const speedValue = document.getElementById("speedValue");
    const playBtn = document.getElementById("playBtn");
    const autoBtn = document.getElementById("autoBtn");
    const groupToggle = document.getElementById("groupToggle");

    let current = 0;
    let playing = true;
    let autoBrowse = false;
    let timer = null;

    function renderGrid() {
      grid.innerHTML = "";
      experiments.forEach((item, index) => {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.innerHTML = `
          <span class="card-index">EXPERIMENT ${String(index + 1).padStart(2, "0")}</span>
          <span class="card-title">${item.title}</span>
          <span class="card-category">${item.category}</span>`;
        card.addEventListener("click", () => selectExperiment(index));
        grid.appendChild(card);
      });
    }

    function updatePlayState() {
      word.style.animationPlayState = playing ? "running" : "paused";
      document.querySelectorAll(".letter").forEach(letter => {
        letter.style.animationPlayState = playing ? "running" : "paused";
      });
      playBtn.textContent = playing ? "❚❚ 暂停" : "▶ 播放";
    }

    function selectExperiment(index) {
      current = (index + experiments.length) % experiments.length;
      const item = experiments[current];

      word.className = `word f-${item.key}${groupToggle.checked ? " grouped" : ""}`;
      stage.style.setProperty("--accent", item.accent);
      stage.style.setProperty("--glow", item.glow);

      // 重新启动完整动画周期
      word.style.animation = "none";
      void word.offsetWidth;
      word.style.animation = "";

      document.querySelectorAll(".card").forEach((card, i) => {
        card.classList.toggle("selected", i === current);
      });

      document.getElementById("currentCount").textContent =
        String(current + 1).padStart(2, "0");
      document.getElementById("liveLabel").textContent =
        `${item.title.toUpperCase()} · ${item.category.toUpperCase()}`;

      updatePlayState();
      scheduleNext();
    }

    function scheduleNext() {
      clearTimeout(timer);
      if (autoBrowse && playing) {
        const seconds = 8 / Number(speed.value);
        timer = setTimeout(() => selectExperiment(current + 1), seconds * 1000);
      }
    }

    document.getElementById("prevBtn").addEventListener("click", () => {
      selectExperiment(current - 1);
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      selectExperiment(current + 1);
    });

    document.getElementById("randomBtn").addEventListener("click", () => {
      let next = current;
      while (experiments.length > 1 && next === current) {
        next = Math.floor(Math.random() * experiments.length);
      }
      selectExperiment(next);
    });

    playBtn.addEventListener("click", () => {
      playing = !playing;
      updatePlayState();
      scheduleNext();
    });

    autoBtn.addEventListener("click", () => {
      autoBrowse = !autoBrowse;
      autoBtn.textContent = autoBrowse ? "▶ 连续浏览：开" : "▶ 连续浏览：关";
      autoBtn.classList.toggle("active", autoBrowse);
      scheduleNext();
    });

    speed.addEventListener("input", () => {
      const value = Number(speed.value);
      speedValue.textContent = `${value.toFixed(1)}×`;
      document.documentElement.style.setProperty("--duration", `${8 / value}s`);
      scheduleNext();
    });

    groupToggle.addEventListener("change", () => {
      const item = experiments[current];
      word.className = `word f-${item.key}${groupToggle.checked ? " grouped" : ""}`;
      selectExperiment(current);
    });

    renderGrid();
    selectExperiment(0);
  </script>
</body>
</html>
