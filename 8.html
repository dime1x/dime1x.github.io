<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deople 120+ 独立手写动效实验室</title>
    <style>
        :root {
            --color-d: #0084FF;
            --color-e1: #FF1E1E;
            --color-o: #FFC107;
            --color-p: #8B2DF2;
            --color-l: #00A63F;
            --color-e2: #FF6B00;
            --bg-color: #F8F9FA;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
            perspective: 1000px;
        }

        .logo-container {
            display: flex; align-items: center; justify-content: center;
            gap: 15px; height: 300px; position: relative; z-index: 10;
        }

        .letter-wrapper {
            position: relative; width: 100px; height: 100px;
            display: flex; justify-content: center; align-items: center;
            /* 动画核心属性 */
            animation-duration: 6s;
            animation-fill-mode: both;
            animation-timing-function: ease-in-out;
        }

        .letter-text {
            position: absolute; font-size: 48px; font-weight: 900; z-index: 2;
            font-family: Arial, sans-serif;
        }

        .shape {
            position: absolute; width: 100%; height: 100%; z-index: 1;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* 品牌形状还原 */
        .letter-d .shape { background-color: var(--color-d); border-radius: 20px; }
        .letter-d .letter-text { color: white; }
        .letter-e1 .shape { background-color: var(--color-e1); border-radius: 50%; }
        .letter-e1 .letter-text { color: white; }
        .letter-o .shape { background-color: var(--color-o); transform: rotate(45deg) scale(0.85); border-radius: 10px; }
        .letter-o .letter-text { color: black; }
        .letter-p .shape { background-color: var(--color-p); clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%); transform: rotate(90deg) scale(0.95); }
        .letter-p .letter-text { color: white; }
        .letter-l .shape { background-color: var(--color-l); border-radius: 50px; width: 50%; }
        .letter-l .letter-text { color: white; }
        .letter-e2 .shape { background-color: var(--color-e2); clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); transform: scale(0.9); }
        .letter-e2 .letter-text { color: black; }

        /* 控制面板 */
        .control-panel {
            position: fixed; bottom: 30px; display: flex; gap: 20px; align-items: center;
            background: white; padding: 15px 30px; border-radius: 50px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); z-index: 100;
        }

        button {
            padding: 10px 20px; border: none; border-radius: 25px; background-color: #333;
            color: white; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        button:hover { background-color: #555; transform: translateY(-2px); }
        button.active { background-color: var(--color-d); }

        .slider-container { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; color: #555; }
        input[type=range] { -webkit-appearance: none; width: 120px; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--color-d); cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #ddd; border-radius: 2px; }

        .hud {
            position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.7); color: #00ffcc;
            padding: 10px 20px; border-radius: 10px; font-family: monospace; font-size: 16px;
            z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* =========================================================
           硬核手写：120 种独立 CSS 动画关键帧 (分类摘要)
           ========================================================= */
        
        /* --- 第 1 类：弹性与跳跃 (1-20) --- */
        @keyframes anim1 { 0% { transform: translateY(-200px); opacity: 0; } 50% { transform: translateY(20px); opacity: 1; } 70% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
        @keyframes anim2 { 0% { transform: scale(0); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
        @keyframes anim3 { 0% { transform: translateX(-100vw) rotate(-360deg); } 100% { transform: translateX(0) rotate(0); } }
        @keyframes anim4 { 0% { transform: translateY(0); } 50% { transform: translateY(-80px); } 100% { transform: translateY(0); } }
        @keyframes anim5 { 0% { transform: scaleY(0); transform-origin: bottom; } 70% { transform: scaleY(1.1); } 100% { transform: scaleY(1); } }
        @keyframes anim6 { 0% { transform: translateX(200px) skewX(45deg); } 60% { transform: translateX(-10px) skewX(-10deg); } 100% { transform: translateX(0) skewX(0); } }
        @keyframes anim7 { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-20deg); } 50% { transform: rotate(20deg); } 75% { transform: rotate(-10deg); } }
        @keyframes anim8 { 0% { transform: scale(2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes anim9 { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(-50px) scale(1.1); } 100% { transform: translateY(0) scale(1); } }
        @keyframes anim10 { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.8, 1.2); } }
        @keyframes anim11 { 0% { transform: translateX(-50px); opacity: 0; } 50% { transform: translateX(10px); opacity: 1; } 100% { transform: translateX(0); } }
        @keyframes anim12 { 0% { transform: rotateY(90deg) scale(0.5); } 100% { transform: rotateY(0) scale(1); } }
        @keyframes anim13 { 0% { transform: translateY(-100px) scale(0.5); opacity: 0; } 50% { transform: translateY(10px) scale(1.1); } 100% { transform: translateY(0) scale(1); } }
        @keyframes anim14 { 0%, 100% { transform: translateX(0); } 33% { transform: translateX(-20px); } 66% { transform: translateX(20px); } }
        @keyframes anim15 { 0% { transform: perspective(500px) translateZ(-100px); opacity: 0; } 100% { transform: perspective(500px) translateZ(0); opacity: 1; } }
        @keyframes anim16 { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); filter: blur(2px); } }
        @keyframes anim17 { 0% { transform: translate(-100px, -100px); } 50% { transform: translate(-50px, 50px); } 100% { transform: translate(0, 0); } }
        @keyframes anim18 { 0% { transform: scaleX(0); transform-origin: left; } 100% { transform: scaleX(1); } }
        @keyframes anim19 { 0% { transform: rotate(180deg) scale(0); } 100% { transform: rotate(0) scale(1); } }
        @keyframes anim20 { 0% { transform: translateY(100px); opacity: 0; } 80% { transform: translateY(-10px); opacity: 1; } 100% { transform: translateY(0); } }

        /* --- 第 2 类：3D空间与翻转 (21-40) --- */
        @keyframes anim21 { 0% { transform: rotateX(180deg) translateZ(100px); opacity: 0; } 100% { transform: rotateX(0) translateZ(0); opacity: 1; } }
        @keyframes anim22 { 0% { transform: rotateY(180deg) translateZ(-100px); opacity: 0; } 100% { transform: rotateY(0) translateZ(0); opacity: 1; } }
        @keyframes anim23 { 0%, 100% { transform: rotateY(0); } 50% { transform: rotateY(180deg); } }
        @keyframes anim24 { 0% { transform: rotateX(90deg); transform-origin: top; } 100% { transform: rotateX(0); } }
        @keyframes anim25 { 0% { transform: rotateY(-90deg); transform-origin: left; opacity: 0; } 100% { transform: rotateY(0); opacity: 1; } }
        @keyframes anim26 { 0% { transform: perspective(1000px) rotateX(60deg) translateY(100px) scale(0.5); } 100% { transform: perspective(1000px) rotateX(0) translateY(0) scale(1); } }
        @keyframes anim27 { 0% { transform: scale3d(0.1, 0.1, 0.1) rotate3d(1, 1, 1, 720deg); opacity: 0; } 100% { transform: scale3d(1, 1, 1) rotate3d(1, 1, 1, 0deg); opacity: 1; } }
        @keyframes anim28 { 0% { transform: translateZ(-500px) rotateX(-180deg); } 100% { transform: translateZ(0) rotateX(0); } }
        @keyframes anim29 { 0%, 100% { transform: rotate3d(1, 0, 0, 0deg); } 50% { transform: rotate3d(1, 0, 0, 360deg); } }
        @keyframes anim30 { 0%, 100% { transform: rotate3d(0, 1, 0, 0deg); } 50% { transform: rotate3d(0, 1, 0, 360deg); } }
        @keyframes anim31 { 0% { transform: perspective(500px) rotateY(90deg) translateX(100px); } 100% { transform: perspective(500px) rotateY(0) translateX(0); } }
        @keyframes anim32 { 0% { transform: rotateX(-90deg) translateY(-100px); opacity: 0; } 60% { transform: rotateX(20deg) translateY(0); opacity: 1; } 100% { transform: rotateX(0); } }
        @keyframes anim33 { 0% { transform: translate3d(200px, -200px, -200px) rotate3d(1,1,0, 180deg); } 100% { transform: translate3d(0,0,0) rotate3d(1,1,0, 0deg); } }
        @keyframes anim34 { 0%, 100% { transform: perspective(600px) rotateY(0deg); } 50% { transform: perspective(600px) rotateY(-180deg) scale(0.5); } }
        @keyframes anim35 { 0% { transform: rotateX(45deg) rotateY(45deg) scale(0); } 100% { transform: rotateX(0) rotateY(0) scale(1); } }
        @keyframes anim36 { 0% { transform: translateZ(200px) scale(2); opacity: 0; } 100% { transform: translateZ(0) scale(1); opacity: 1; } }
        @keyframes anim37 { 0% { transform: rotateY(90deg) rotateX(90deg); } 100% { transform: rotateY(0) rotateX(0); } }
        @keyframes anim38 { 0%, 100% { transform: perspective(1000px) rotateY(0); } 50% { transform: perspective(1000px) rotateY(45deg); } }
        @keyframes anim39 { 0% { transform: translateX(100vw) rotateY(90deg); } 100% { transform: translateX(0) rotateY(0); } }
        @keyframes anim40 { 0% { transform: scaleZ(0.1) rotateX(360deg); opacity: 0; } 100% { transform: scaleZ(1) rotateX(0); opacity: 1; } }

        /* --- 第 3 类：形变与液态 (41-60) --- */
        @keyframes anim41 { 0%, 100% { border-radius: 20px; } 50% { border-radius: 50%; transform: scale(1.2); } }
        @keyframes anim42 { 0%, 100% { border-radius: 50%; } 50% { border-radius: 20px; transform: rotate(90deg); } }
        @keyframes anim43 { 0% { transform: scale(1); } 33% { transform: scale(1.3, 0.7); } 66% { transform: scale(0.7, 1.3); } 100% { transform: scale(1); } }
        @keyframes anim44 { 0%, 100% { transform: skewX(0); } 25% { transform: skewX(20deg); } 75% { transform: skewX(-20deg); } }
        @keyframes anim45 { 0% { transform: scale(0) translate(100px, 100px); border-radius: 50%; } 100% { transform: scale(1) translate(0,0); border-radius: 0; } }
        @keyframes anim46 { 0%, 100% { border-radius: 20px; transform: rotate(0); } 50% { border-radius: 50% 20px 50% 20px; transform: rotate(180deg); } }
        @keyframes anim47 { 0% { transform: scaleX(0) scaleY(1); } 50% { transform: scaleX(1.5) scaleY(0.5); } 100% { transform: scaleX(1) scaleY(1); } }
        @keyframes anim48 { 0% { filter: blur(0); transform: scale(1); } 50% { filter: blur(10px); transform: scale(1.2) translateY(-20px); } 100% { filter: blur(0); transform: scale(1); } }
        @keyframes anim49 { 0% { clip-path: polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%); } 100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); } }
        @keyframes anim50 { 0%, 100% { transform: scale(1) rotate(0); } 30% { transform: scale(1.2, 0.8) rotate(10deg); } 60% { transform: scale(0.8, 1.2) rotate(-10deg); } }
        @keyframes anim51 { 0% { border-radius: 50%; transform: rotate(0); } 100% { border-radius: 20px; transform: rotate(360deg); } }
        @keyframes anim52 { 0% { transform: scale(0.5) rotate(-180deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
        @keyframes anim53 { 0% { border-radius: 0; } 50% { border-radius: 50%; transform: scale(1.3) rotate(45deg); } 100% { border-radius: 20px; transform: scale(1) rotate(0); } }
        @keyframes anim54 { 0% { opacity: 0; transform: scale(0.1) translateY(100px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes anim55 { 0%, 100% { transform: perspective(500px) rotateX(0); } 50% { transform: perspective(500px) rotateX(360deg) scale(0.5); } }
        @keyframes anim56 { 0% { transform: scale(1) translateX(0); filter: hue-rotate(0deg); } 50% { transform: scale(1.1) translateX(10px); filter: hue-rotate(90deg); } 100% { transform: scale(1) translateX(0); filter: hue-rotate(0deg); } }
        @keyframes anim57 { 0% { border-radius: 50%; transform: rotate(45deg) scale(0.85); } 50% { border-radius: 20px; transform: rotate(0) scale(1); } 100% { border-radius: 50%; transform: rotate(45deg) scale(0.85); } }
        @keyframes anim58 { 0% { transform: translateY(0) scaleY(1); transform-origin: bottom; } 50% { transform: translateY(-50px) scaleY(1.5); transform-origin: bottom; } 100% { transform: translateY(0) scaleY(1); transform-origin: bottom; } }
        @keyframes anim59 { 0% { transform: scale(0) rotate(0); opacity: 0; } 80% { transform: scale(1.1) rotate(180deg); opacity: 1; } 100% { transform: scale(1) rotate(360deg); } }
        @keyframes anim60 { 0%, 100% { transform: skew(0, 0); } 25% { transform: skew(15deg, 0); } 75% { transform: skew(0, 15deg); } }

        /* --- 第 4 类：机械与故障 (61-80) --- */
        @keyframes anim61 { 0% { transform: translate(0); } 20% { transform: translate(-10px, 10px); } 40% { transform: translate(10px, -10px); } 60% { transform: translate(-10px, -10px); } 80% { transform: translate(10px, 10px); } 100% { transform: translate(0); } }
        @keyframes anim62 { 0%, 100% { opacity: 1; } 10%, 30%, 50%, 70%, 90% { opacity: 0; } 20%, 40%, 60%, 80% { opacity: 1; } }
        @keyframes anim63 { 0% { transform: translateX(0); } 10% { transform: translateX(-20px); } 20% { transform: translateX(20px); } 30% { transform: translateX(-10px); } 40% { transform: translateX(0); } 100% { transform: translateX(0); } }
        @keyframes anim64 { 0% { clip-path: inset(0 0 0 0); } 50% { clip-path: inset(20% 0 40% 0); transform: translateY(-10px); } 100% { clip-path: inset(0 0 0 0); transform: translateY(0); } }
        @keyframes anim65 { 0%, 100% { transform: translateX(0); filter: invert(0); } 20% { transform: translateX(-5px); filter: invert(1); } 40% { transform: translateX(5px); filter: invert(0); } 60% { transform: translateX(-5px); filter: invert(1); } 80% { transform: translateX(5px); filter: invert(0); } }
        @keyframes anim66 { 0% { transform: translate(0,0); } 25% { transform: translate(50px, 0); } 50% { transform: translate(50px, 50px); } 75% { transform: translate(0, 50px); } 100% { transform: translate(0,0); } }
        @keyframes anim67 { 0% { transform: scale(1); } 50% { transform: scale(1.1, 0.9) translateY(-20px); } 100% { transform: scale(1); } }
        @keyframes anim68 { 0% { transform: rotate(0); } 10% { transform: rotate(10deg); } 20% { transform: rotate(-10deg); } 30% { transform: rotate(0); } 100% { transform: rotate(0); } }
        @keyframes anim69 { 0% { transform: perspective(500px) rotateY(0); } 20% { transform: perspective(500px) rotateY(30deg); } 40% { transform: perspective(500px) rotateY(-30deg); } 100% { transform: perspective(500px) rotateY(0); } }
        @keyframes anim70 { 0% { transform: translateX(0) skewX(0); } 50% { transform: translateX(20px) skewX(20deg); } 100% { transform: translateX(0) skewX(0); } }
        @keyframes anim71 { 0% { box-shadow: 0 0 0 0 rgba(0,0,0,0.5); } 50% { box-shadow: 0 0 50px 20px rgba(0,0,0,0); transform: scale(1.1); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); transform: scale(1); } }
        @keyframes anim72 { 0% { transform: scale(1) rotate(0); } 50% { transform: scale(1.5) rotate(180deg); } 100% { transform: scale(1) rotate(360deg); } }
        @keyframes anim73 { 0% { transform: translateY(0); } 50% { transform: translateY(20px) scaleY(0.8); } 100% { transform: translateY(0); } }
        @keyframes anim74 { 0%, 100% { transform: translateX(0); } 10%, 30%, 50%, 70%, 90% { transform: translateX(5px); } 20%, 40%, 60%, 80% { transform: translateX(-5px); } }
        @keyframes anim75 { 0% { filter: grayscale(100%); transform: scale(0.9); } 100% { filter: grayscale(0); transform: scale(1); } }
        @keyframes anim76 { 0% { transform: translateZ(0) rotateX(0); opacity: 1; } 50% { transform: translateZ(100px) rotateX(90deg); opacity: 0; } 100% { transform: translateZ(0) rotateX(0); opacity: 1; } }
        @keyframes anim77 { 0% { transform: translate(0, 0) rotate(0); } 33% { transform: translate(20px, -20px) rotate(120deg); } 66% { transform: translate(-20px, 20px) rotate(240deg); } 100% { transform: translate(0, 0) rotate(360deg); } }
        @keyframes anim78 { 0% { border-radius: 50%; } 50% { border-radius: 50% 10% 50% 10%; transform: rotate(90deg); } 100% { border-radius: 50%; transform: rotate(180deg); } }
        @keyframes anim79 { 0% { opacity: 0; transform: translateY(50px) scale(0.5); } 80% { opacity: 1; transform: translateY(-10px) scale(1.1); } 100% { transform: translateY(0) scale(1); } }
        @keyframes anim80 { 0% { transform: scale(1); } 50% { transform: scale(1.2) rotate(-5deg); } 100% { transform: scale(1); } }

        /* --- 第 5 类：粒子与轨迹 (81-100) --- */
        @keyframes anim81 { 0% { transform: translate(-100px, 0) rotate(-180deg); opacity: 0; } 100% { transform: translate(0, 0) rotate(0); opacity: 1; } }
        @keyframes anim82 { 0% { transform: translate(100px, 0) rotate(180deg); opacity: 0; } 100% { transform: translate(0, 0) rotate(0); opacity: 1; } }
        @keyframes anim83 { 0% { transform: translate(0, -100px) scale(0); } 50% { transform: translate(0, 20px) scale(1.2); } 100% { transform: translate(0, 0) scale(1); } }
        @keyframes anim84 { 0% { transform: translate(0, 100px) scale(0); } 50% { transform: translate(0, -20px) scale(1.2); } 100% { transform: translate(0, 0) scale(1); } }
        @keyframes anim85 { 0% { transform: translate(-200px, -200px) rotate(-360deg); } 100% { transform: translate(0,0) rotate(0); } }
        @keyframes anim86 { 0% { transform: translate(200px, -200px) rotate(360deg); } 100% { transform: translate(0,0) rotate(0); } }
        @keyframes anim87 { 0% { transform: scale(0) translate(100px, 100px); } 100% { transform: scale(1) translate(0, 0); } }
        @keyframes anim88 { 0% { transform: scale(0) translate(-100px, -100px); } 100% { transform: scale(1) translate(0, 0); } }
        @keyframes anim89 { 0% { transform: rotate(-720deg) scale(0); } 100% { transform: rotate(0) scale(1); } }
        @keyframes anim90 { 0% { transform: rotate(720deg) scale(0); } 100% { transform: rotate(0) scale(1); } }
        @keyframes anim91 { 0% { transform: translateX(-50vw) rotate(90deg); opacity: 0; } 50% { transform: translateX(20px) rotate(-10deg); opacity: 1; } 100% { transform: translateX(0) rotate(0); } }
        @keyframes anim92 { 0% { transform: translateX(50vw) rotate(-90deg); opacity: 0; } 50% { transform: translateX(-20px) rotate(10deg); opacity: 1; } 100% { transform: translateX(0) rotate(0); } }
        @keyframes anim93 { 0% { transform: translateY(-100vh) rotate(180deg); } 100% { transform: translateY(0) rotate(0); } }
        @keyframes anim94 { 0% { transform: translateY(100vh) rotate(-180deg); } 100% { transform: translateY(0) rotate(0); } }
        @keyframes anim95 { 0% { transform: translate(0, 0) scale(0); } 50% { transform: translate(50px, -50px) scale(1); } 100% { transform: translate(0, 0) scale(1); } }
        @keyframes anim96 { 0% { transform: translate(0, 0) scale(0); } 50% { transform: translate(-50px, 50px) scale(1); } 100% { transform: translate(0, 0) scale(1); } }
        @keyframes anim97 { 0% { transform: perspective(500px) translateZ(-500px) rotate(180deg); } 100% { transform: perspective(500px) translateZ(0) rotate(0); } }
        @keyframes anim98 { 0% { transform: perspective(500px) translateZ(500px) rotate(-180deg); opacity: 0; } 100% { transform: perspective(500px) translateZ(0) rotate(0); opacity: 1; } }
        @keyframes anim99 { 0% { transform: translate(0, -200px) rotate(-45deg); opacity: 0; } 50% { transform: translate(0, 20px) rotate(10deg); opacity: 1; } 100% { transform: translate(0, 0) rotate(0); } }
        @keyframes anim100 { 0% { transform: translate(0, 200px) rotate(45deg); opacity: 0; } 50% { transform: translate(0, -20px) rotate(-10deg); opacity: 1; } 100% { transform: translate(0, 0) rotate(0); } }

        /* --- 第 6 类：复合与路径 (101-120) --- */
        @keyframes anim101 { 0% { transform: translateX(0) rotate(0); } 25% { transform: translateX(50px) rotate(45deg); } 50% { transform: translateX(0) rotate(90deg); } 75% { transform: translateX(-50px) rotate(45deg); } 100% { transform: translateX(0) rotate(0); } }
        @keyframes anim102 { 0% { transform: scale(1) rotateY(0); } 50% { transform: scale(1.5) rotateY(180deg); } 100% { transform: scale(1) rotateY(360deg); } }
        @keyframes anim103 { 0% { transform: translateY(0) rotateX(0); } 50% { transform: translateY(-50px) rotateX(180deg); } 100% { transform: translateY(0) rotateX(360deg); } }
        @keyframes anim104 { 0% { transform: scale(0.5) translate(100px, -100px) rotate(45deg); } 100% { transform: scale(1) translate(0,0) rotate(0); } }
        @keyframes anim105 { 0% { transform: scale(0.5) translate(-100px, 100px) rotate(-45deg); } 100% { transform: scale(1) translate(0,0) rotate(0); } }
        @keyframes anim106 { 0% { transform: scale(0.5) translate(100px, 100px) rotate(90deg); } 100% { transform: scale(1) translate(0,0) rotate(0); } }
        @keyframes anim107 { 0% { transform: scale(0.5) translate(-100px, -100px) rotate(-90deg); } 100% { transform: scale(1) translate(0,0) rotate(0); } }
        @keyframes anim108 { 0% { transform: translateY(-100px) scale(2); opacity: 0; filter: blur(10px); } 100% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); } }
        @keyframes anim109 { 0% { transform: translateY(100px) scale(0); opacity: 0; filter: blur(10px); } 100% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); } }
        @keyframes anim110 { 0% { transform: translateX(-100px) scale(2); opacity: 0; } 100% { transform: translateX(0) scale(1); opacity: 1; } }
        @keyframes anim111 { 0% { transform: translateX(100px) scale(2); opacity: 0; } 100% { transform: translateX(0) scale(1); opacity: 1; } }
        @keyframes anim112 { 0% { clip-path: inset(0 100% 0 0); } 100% { clip-path: inset(0 0 0 0); } }
        @keyframes anim113 { 0% { clip-path: inset(0 0 0 100%); } 100% { clip-path: inset(0 0 0 0); } }
        @keyframes anim114 { 0% { clip-path: inset(100% 0 0 0); } 100% { clip-path: inset(0 0 0 0); } }
        @keyframes anim115 { 0% { clip-path: inset(0 0 100% 0); } 100% { clip-path: inset(0 0 0 0); } }
        @keyframes anim116 { 0% { transform: scale(1) skewX(0); } 50% { transform: scale(1.2) skewX(20deg); } 100% { transform: scale(1) skewX(0); } }
        @keyframes anim117 { 0% { transform: scale(1) skewY(0); } 50% { transform: scale(1.2) skewY(20deg); } 100% { transform: scale(1) skewY(0); } }
        @keyframes anim118 { 0% { transform: rotate(0) scale(0); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
        @keyframes anim119 { 0% { transform: rotate(0) scale(2); opacity: 0; } 50% { transform: rotate(-180deg) scale(0.8); opacity: 1; } 100% { transform: rotate(-360deg) scale(1); } }
        @keyframes anim120 { 0% { transform: scale(0) rotate(-360deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }

        /* 动态映射动画类 */
        [class*="anim-"] { animation-fill-mode: both; animation-timing-function: ease-in-out; }
        
    </style>
</head>
<body>

    <div class="hud" id="hud">当前动画: 等待启动...</div>

    <div class="logo-container" id="logoContainer">
        <div class="letter-wrapper letter-d"><div class="shape"></div><div class="letter-text">D</div></div>
        <div class="letter-wrapper letter-e1"><div class="shape"></div><div class="letter-text">e</div></div>
        <div class="letter-wrapper letter-o"><div class="shape"></div><div class="letter-text">o</div></div>
        <div class="letter-wrapper letter-p"><div class="shape"></div><div class="letter-text">p</div></div>
        <div class="letter-wrapper letter-l"><div class="shape"></div><div class="letter-text">l</div></div>
        <div class="letter-wrapper letter-e2"><div class="shape"></div><div class="letter-text">e</div></div>
    </div>

    <div class="control-panel">
        <button id="prevBtn">⏮ 上一个</button>
        <button id="playBtn" class="active">自动播放</button>
        <button id="nextBtn">下一个 ⏭</button>
        <button id="randomBtn">🎲 随机</button>
        <div class="slider-container">
            <span>速度:</span>
            <input type="range" id="speedSlider" min="0.2" max="3" step="0.1" value="1">
            <span id="speedVal">1.0x</span>
        </div>
    </div>

    <script>
        const letters = document.querySelectorAll('.letter-wrapper');
        const hud = document.getElementById('hud');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const randomBtn = document.getElementById('randomBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedVal = document.getElementById('speedVal');

        let currentIndex = 1;
        const MAX_ANIMATIONS = 120;
        let isPlaying = true;
        let autoPlayInterval;
        let currentSpeed = 1;
        let animationDuration = 6000; // 基础时长 6秒

        // 核心切换逻辑
        function applyAnimation(index) {
            currentIndex = index;
            if (currentIndex > MAX_ANIMATIONS) currentIndex = 1;
            if (currentIndex < 1) currentIndex = MAX_ANIMATIONS;

            hud.textContent = `当前动画: anim${currentIndex} / 120`;

            // 移除所有动画类
            letters.forEach(letter => {
                letter.className = letter.className.replace(/anim-\d+/g, '').trim();
            });

            // 强制浏览器重绘 (触发重排，从而允许重新触发CSS动画)
            void document.body.offsetWidth;

            // 添加新的动画类
            letters.forEach((letter, i) => {
                // 根据字母索引分配动画: 全局同一种，或交错(当前是全局同一种，保证120种风格清晰可见)
                // 为了实现"起承转合"和"交错碰撞"，我们给每个字母加上不同的延迟
                letter.style.animationName = `anim${currentIndex}`;
                letter.style.animationDuration = `${animationDuration}ms`;
                letter.style.animationDelay = `${i * 0.1}s`; 
                letter.style.animationPlayState = isPlaying ? 'running' : 'paused';
                letter.style.animationTimingFunction = getTimingFunction(currentIndex);
            });
        }

        // 根据编号分配不同的缓动函数
        function getTimingFunction(index) {
            const mod = index % 5;
            if (mod === 0) return 'steps(5, end)'; // 机械感
            if (mod === 1) return 'cubic-bezier(0.68, -0.55, 0.27, 1.55)'; // 弹性
            if (mod === 2) return 'cubic-bezier(0.77, 0, 0.175, 1)'; // 科技
            if (mod === 3) return 'cubic-bezier(0.175, 0.885, 0.32, 1.275)'; // 回弹
            return 'ease-in-out'; // 平滑
        }

        // 自动播放逻辑
        function togglePlay() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = '暂停播放';
                playBtn.classList.add('active');
                letters.forEach(l => l.style.animationPlayState = 'running');
                scheduleNext();
            } else {
                playBtn.textContent = '继续播放';
                playBtn.classList.remove('active');
                letters.forEach(l => l.style.animationPlayState = 'paused');
                clearTimeout(autoPlayInterval);
            }
        }

        function scheduleNext() {
            clearTimeout(autoPlayInterval);
            if (isPlaying) {
                autoPlayInterval = setTimeout(() => {
                    applyAnimation(currentIndex + 1);
                    scheduleNext();
                }, animationDuration * (1 / currentSpeed) + 500); // 动画时长 + 停顿
            }
        }

        // 事件绑定
        playBtn.addEventListener('click', togglePlay);
        
        nextBtn.addEventListener('click', () => {
            applyAnimation(currentIndex + 1);
            if (isPlaying) scheduleNext();
        });

        prevBtn.addEventListener('click', () => {
            applyAnimation(currentIndex - 1);
            if (isPlaying) scheduleNext();
        });

        randomBtn.addEventListener('click', () => {
            const rand = Math.floor(Math.random() * MAX_ANIMATIONS) + 1;
            applyAnimation(rand);
            if (isPlaying) scheduleNext();
        });

        speedSlider.addEventListener('input', (e) => {
            currentSpeed = parseFloat(e.target.value);
            speedVal.textContent = currentSpeed.toFixed(1) + 'x';
            letters.forEach(l => {
                // 改变播放速率时，需要重新计算时长
                l.style.animationDuration = `${animationDuration / currentSpeed}ms`;
            });
            if (isPlaying) scheduleNext();
        });

        // 初始化
        window.onload = () => {
            applyAnimation(1);
            scheduleNext();
        };
    </script>
</body>
</html>
