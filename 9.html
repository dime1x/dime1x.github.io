<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deople Logo 动效实验室 (36套核心引擎)</title>
    <style>
        :root {
            --color-d: #0084FF; --color-e1: #FF1E1E; --color-o: #FFC107;
            --color-p: #8B2DF2; --color-l: #00A63F; --color-e2: #FF6B00;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #F8F9FA; display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-family: system-ui, sans-serif;
            overflow: hidden; perspective: 1000px;
        }

        .logo-container { display: flex; align-items: center; justify-content: center; gap: 15px; height: 300px; }
        
        .letter-wrapper {
            position: relative; width: 100px; height: 100px;
            display: flex; justify-content: center; align-items: center;
            animation-duration: 6s; /* 满足 6-12 秒的要求 */
            animation-fill-mode: both;
            will-change: transform, opacity, border-radius, filter;
        }

        .letter-text { position: absolute; font-size: 48px; font-weight: 900; z-index: 2; font-family: Arial, sans-serif; }
        .shape { position: absolute; width: 100%; height: 100%; z-index: 1; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        /* 品牌形状还原 */
        .letter-d .shape { background-color: var(--color-d); border-radius: 20px; } .letter-d .letter-text { color: white; }
        .letter-e1 .shape { background-color: var(--color-e1); border-radius: 50%; } .letter-e1 .letter-text { color: white; }
        .letter-o .shape { background-color: var(--color-o); transform: rotate(45deg) scale(0.85); border-radius: 10px; } .letter-o .letter-text { color: black; }
        .letter-p .shape { background-color: var(--color-p); clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%); transform: rotate(90deg) scale(0.95); } .letter-p .letter-text { color: white; }
        .letter-l .shape { background-color: var(--color-l); border-radius: 50px; width: 50%; } .letter-l .letter-text { color: white; }
        .letter-e2 .shape { background-color: var(--color-e2); clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); transform: scale(0.9); } .letter-e2 .letter-text { color: black; }

        /* UI 控制面板 */
        .control-panel {
            position: fixed; bottom: 30px; display: flex; gap: 15px; align-items: center;
            background: #fff; padding: 15px 30px; border-radius: 50px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); z-index: 100;
        }
        button {
            padding: 10px 20px; border: none; border-radius: 25px; background: #333;
            color: white; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #555; transform: translateY(-2px); }
        button.active { background: var(--color-d); }
        .slider-box { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; color: #555; }
        input[type=range] { -webkit-appearance: none; width: 100px; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--color-d); cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #ddd; border-radius: 2px; }

        .hud { position: fixed; top: 20px; left: 20px; background: #222; color: #0f0; padding: 10px 20px; border-radius: 8px; font-family: monospace; font-size: 14px; z-index: 100; }

        /* =========================================================
           硬核手写：36 套完全独立的 CSS 动画关键帧 (涵盖所有风格)
           ========================================================= */
        /* 1. 弹跳进入 */
        @keyframes a1 { 0% { transform: translateY(-200px); opacity: 0; } 60% { transform: translateY(20px); opacity: 1; } 80% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
        /* 2. 左侧滑入 */
        @keyframes a2 { 0% { transform: translateX(-300px) rotate(-90deg); opacity: 0; } 100% { transform: translateX(0) rotate(0); opacity: 1; } }
        /* 3. 右侧滑入 */
        @keyframes a3 { 0% { transform: translateX(300px) rotate(90deg); opacity: 0; } 100% { transform: translateX(0) rotate(0); opacity: 1; } }
        /* 4. Y轴3D翻转 */
        @keyframes a4 { 0% { transform: perspective(500px) rotateY(180deg) scale(0.5); opacity: 0; } 100% { transform: perspective(500px) rotateY(0) scale(1); opacity: 1; } }
        /* 5. X轴3D翻转 */
        @keyframes a5 { 0% { transform: perspective(500px) rotateX(180deg) scale(0.5); opacity: 0; } 100% { transform: perspective(500px) rotateX(0) scale(1); opacity: 1; } }
        /* 6. 脉冲缩放 */
        @keyframes a6 { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        /* 7. 弹性放大 */
        @keyframes a7 { 0% { transform: scale(0); } 60% { transform: scale(1.2); } 80% { transform: scale(0.9); } 100% { transform: scale(1); } }
        /* 8. 机械水平抖动 */
        @keyframes a8 { 0%, 100% { transform: translateX(0); } 10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); } 20%, 40%, 60%, 80% { transform: translateX(10px); } }
        /* 9. 故障闪烁 */
        @keyframes a9 { 0% { transform: translate(0); } 20% { transform: translate(-5px, 5px); filter: invert(1); } 40% { transform: translate(5px, -5px); } 60% { transform: translate(-5px, -5px); filter: invert(1); } 80% { transform: translate(5px, 5px); } 100% { transform: translate(0); filter: invert(0); } }
        /* 10. 液态形变 (圆变方) */
        @keyframes a10 { 0%, 100% { border-radius: 50%; transform: rotate(0) scale(1); } 50% { border-radius: 20px; transform: rotate(180deg) scale(1.2); } }
        /* 11. 倾斜扭曲 */
        @keyframes a11 { 0%, 100% { transform: skewX(0) skewY(0); } 25% { transform: skewX(30deg) skewY(-10deg); } 75% { transform: skewX(-30deg) skewY(10deg); } }
        /* 12. 旋转飞入 */
        @keyframes a12 { 0% { transform: rotate(-720deg) scale(0); opacity: 0; } 100% { transform: rotate(0) scale(1); opacity: 1; } }
        /* 13. Z轴冲入 (空间穿梭) */
        @keyframes a13 { 0% { transform: perspective(1000px) translateZ(-1000px); opacity: 0; } 100% { transform: perspective(1000px) translateZ(0); opacity: 1; } }
        /* 14. 掉落弹跳 */
        @keyframes a14 { 0% { transform: translateY(-500px) scaleY(0.5); opacity: 0; } 70% { transform: translateY(20px) scaleY(1.1); opacity: 1; } 100% { transform: translateY(0) scaleY(1); } }
        /* 15. 呼吸浮动 */
        @keyframes a15 { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } }
        /* 16. 爆炸散开再重组 */
        @keyframes a16 { 0% { transform: scale(0) translate(0,0); opacity: 0; } 50% { transform: scale(1.5) translate(100px, -100px) rotate(180deg); opacity: 0.5; } 100% { transform: scale(1) translate(0,0) rotate(0); opacity: 1; } }
        /* 17. 翻跟头进入 */
        @keyframes a17 { 0% { transform: translateX(-200px) rotate(-360deg); opacity: 0; } 100% { transform: translateX(0) rotate(0); opacity: 1; } }
        /* 18. 左右摇摆 */
        @keyframes a18 { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(15deg); } 75% { transform: rotate(-15deg); } }
        /* 19. 模糊聚焦 */
        @keyframes a19 { 0% { filter: blur(20px); transform: scale(2); opacity: 0; } 100% { filter: blur(0); transform: scale(1); opacity: 1; } }
        /* 20. 垂直压缩弹跳 */
        @keyframes a20 { 0% { transform: scaleY(2) translateY(-50px); opacity: 0; } 60% { transform: scaleY(0.8) translateY(0); opacity: 1; } 100% { transform: scaleY(1); } }
        /* 21. 空间扭曲 (交错3D) */
        @keyframes a21 { 0% { transform: rotate3d(1, 1, 1, 0); } 50% { transform: rotate3d(1, 1, 1, 360deg) scale(0.5); } 100% { transform: rotate3d(1, 1, 1, 0) scale(1); } }
        /* 22. 机械步进旋转 */
        @keyframes a22 { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
        /* 23. 碎片化模糊 */
        @keyframes a23 { 0% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); } 25% { clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); transform: translateX(-20px); } 50% { clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); transform: translateX(20px); } 100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); transform: translateX(0); } }
        /* 24. 角度飞入 */
        @keyframes a24 { 0% { transform: translate(200px, -200px) rotate(45deg); opacity: 0; } 100% { transform: translate(0,0) rotate(0); opacity: 1; } }
        /* 25. Z轴深度漂浮 */
        @keyframes a25 { 0%, 100% { transform: perspective(500px) translateZ(0) rotateY(0); } 50% { transform: perspective(500px) translateZ(100px) rotateY(180deg); } }
        /* 26. 双重X轴翻转 */
        @keyframes a26 { 0% { transform: rotateX(0); } 50% { transform: rotateX(360deg) scale(0.5); } 100% { transform: rotateX(720deg) scale(1); } }
        /* 27. 左右分离聚拢 */
        @keyframes a27 { 0% { transform: translateX(-100px); opacity: 0; } 50% { transform: translateX(20px); opacity: 1; } 100% { transform: translateX(0); } }
        /* 28. 负空间进入 */
        @keyframes a28 { 0% { transform: scale(-1, -1) rotate(180deg); opacity: 0; } 100% { transform: scale(1, 1) rotate(0); opacity: 1; } }
        /* 29. 抖动放大 */
        @keyframes a29 { 0% { transform: scale(0.5); } 30% { transform: scale(1.2) translateX(-10px); } 60% { transform: scale(1.2) translateX(10px); } 100% { transform: scale(1) translateX(0); } }
        /* 30. 故障下落 */
        @keyframes a30 { 0% { transform: translateY(-100px); opacity: 0; } 50% { transform: translateY(10px) translateX(10px); opacity: 1; } 70% { transform: translateY(0) translateX(-10px); } 100% { transform: translateY(0) translateX(0); } }
        /* 31. 连续翻滚 */
        @keyframes a31 { 0% { transform: rotateY(0) rotateX(0); } 100% { transform: rotateY(720deg) rotateX(360deg); } }
        /* 32. 挤压变形 */
        @keyframes a32 { 0%, 100% { transform: scale(1, 1); } 25% { transform: scale(1.3, 0.7); } 50% { transform: scale(0.7, 1.3); } 75% { transform: scale(1.1, 0.9); } }
        /* 33. 发光进入 */
        @keyframes a33 { 0% { box-shadow: 0 0 0px transparent; transform: scale(0); } 50% { box-shadow: 0 0 50px #fff; transform: scale(1.2); } 100% { box-shadow: 0 10px 20px rgba(0,0,0,0.1); transform: scale(1); } }
        /* 34. 钟摆运动 */
        @keyframes a34 { 0% { transform: rotateZ(60deg); transform-origin: top; } 33% { transform: rotateZ(-60deg); transform-origin: top; } 66% { transform: rotateZ(30deg); transform-origin: top; } 100% { transform: rotateZ(0); transform-origin: top; } }
        /* 35. 极速坠落 */
        @keyframes a35 { 0% { transform: translateY(-1000px) scaleY(1.5); } 80% { transform: translateY(20px) scaleY(0.8); } 100% { transform: translateY(0) scaleY(1); } }
        /* 36. 整体旋转重组 */
        @keyframes a36 { 0% { transform: rotate(180deg) scale(0); opacity: 0; } 100% { transform: rotate(0) scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="hud" id="hud">状态: 准备启动</div>

    <div class="logo-container" id="logoContainer">
        <div class="letter-wrapper letter-d"><div class="shape"></div><div class="letter-text">D</div></div>
        <div class="letter-wrapper letter-e1"><div class="shape"></div><div class="letter-text">e</div></div>
        <div class="letter-wrapper letter-o"><div class="shape"></div><div class="letter-text">o</div></div>
        <div class="letter-wrapper letter-p"><div class="shape"></div><div class="letter-text">p</div></div>
        <div class="letter-wrapper letter-l"><div class="shape"></div><div class="letter-text">l</div></div>
        <div class="letter-wrapper letter-e2"><div class="shape"></div><div class="letter-text">e</div></div>
    </div>

    <div class="control-panel">
        <button id="prevBtn">⏮ 上一套</button>
        <button id="playBtn" class="active">暂停</button>
        <button id="nextBtn">下一套 ⏭</button>
        <button id="randomBtn" style="background:var(--color-p);">🎲 随机混合</button>
        <div class="slider-box">
            <span>速度:</span>
            <input type="range" id="speedSlider" min="0.2" max="3" step="0.1" value="1">
            <span id="speedVal">1.0x</span>
        </div>
    </div>

    <script>
        const letters = document.querySelectorAll('.letter-wrapper');
        const hud = document.getElementById('hud');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const randomBtn = document.getElementById('randomBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedVal = document.getElementById('speedVal');

        const MAX_ANIM = 36; // 这里是我们独立编写的动画总数
        let currentBaseAnim = 1;
        let isPlaying = true;
        let autoPlayTimer;
        let currentSpeed = 1;
        const DURATION = 6000; // 每次动画持续 6 秒

        // 高级缓动曲线库（赋予同一动画不同灵魂）
        const easings = [
            'cubic-bezier(0.68, -0.55, 0.27, 1.55)', // 强烈弹性
            'cubic-bezier(0.25, 0.1, 0.25, 1)',      // 平滑
            'cubic-bezier(0.77, 0, 0.175, 1)',       // 科技感
            'steps(10, end)'                         // 机械步进
        ];

        // 核心播放逻辑
        function playSequence(baseIndex, isRandomMix = false) {
            if (baseIndex > MAX_ANIM) baseIndex = 1;
            if (baseIndex < 1) baseIndex = MAX_ANIM;
            currentBaseAnim = baseIndex;

            hud.textContent = isRandomMix ? `状态: 随机混合模式` : `状态: 独立动画 a${baseIndex} / ${MAX_ANIM}`;

            letters.forEach((letter, index) => {
                // 移除旧动画，强制重绘
                letter.style.animation = 'none';
                void letter.offsetWidth;

                // 分配动画编号：如果是随机混合，每个字母随机分配；否则使用当前基础编号
                let targetAnim = isRandomMix ? Math.floor(Math.random() * MAX_ANIM) + 1 : baseIndex;
                
                // 随机选择缓动曲线（增加风格差异）
                let easing = easings[index % easings.length];
                // 如果是机械动画 (a8, a22)，强制使用步进
                if (targetAnim === 8 || targetAnim === 22) easing = 'steps(12, end)';

                // 设置 CSS 动画
                letter.style.animationName = `a${targetAnim}`;
                letter.style.animationDuration = `${DURATION / currentSpeed}ms`;
                // 设置交错延迟（交错运动的核心！）
                letter.style.animationDelay = `${index * 0.15}s`; 
                letter.style.animationTimingFunction = easing;
                letter.style.animationPlayState = isPlaying ? 'running' : 'paused';
            });
        }

        // 自动播放下个序列
        function scheduleNext() {
            clearTimeout(autoPlayTimer);
            if (isPlaying) {
                // 动画总时长 + 延迟 + 停顿时间
                const totalTime = (DURATION / currentSpeed) + 1000;
                autoPlayTimer = setTimeout(() => {
                    playSequence(currentBaseAnim + 1, false);
                    scheduleNext();
                }, totalTime);
            }
        }

        // 事件监听
        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playBtn.textContent = isPlaying ? '暂停' : '播放';
            playBtn.classList.toggle('active', isPlaying);
            
            letters.forEach(l => l.style.animationPlayState = isPlaying ? 'running' : 'paused');
            
            if (isPlaying) {
                scheduleNext();
            } else {
                clearTimeout(autoPlayTimer);
            }
        });

        nextBtn.addEventListener('click', () => {
            isPlaying = true; playBtn.textContent = '暂停'; playBtn.classList.add('active');
            playSequence(currentBaseAnim + 1, false);
            scheduleNext();
        });

        prevBtn.addEventListener('click', () => {
            isPlaying = true; playBtn.textContent = '暂停'; playBtn.classList.add('active');
            playSequence(currentBaseAnim - 1, false);
            scheduleNext();
        });

        randomBtn.addEventListener('click', () => {
            isPlaying = true; playBtn.textContent = '暂停'; playBtn.classList.add('active');
            // 开启随机混合：6个字母会从36种动画里各自随机挑选！
            playSequence(0, true);
            scheduleNext();
        });

        speedSlider.addEventListener('input', (e) => {
            currentSpeed = parseFloat(e.target.value);
            speedVal.textContent = currentSpeed.toFixed(1) + 'x';
            // 动态调整速度
            letters.forEach(l => {
                l.style.animationDuration = `${DURATION / currentSpeed}ms`;
            });
            if (isPlaying) scheduleNext();
        });

        // 初始化
        window.onload = () => {
            playSequence(1, false);
            scheduleNext();
        };
    </script>
</body>
</html>
