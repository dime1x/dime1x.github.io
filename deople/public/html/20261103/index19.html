        <!-- FEED LIST (卡片容器：去掉圆角和左右边距，实现无间距通栏贴边) -->

            <!-- 动态渲染 -->
        </div>

        <!-- PAGINATION CONTROLS -->
        <div class="mt-10 pt-6 border-t border-borderSubtle flex flex-col items-center space-y-4 px-4 max-w-3xl mx-auto" id="pagination-wrapper">

                <div id="page-numbers" class="flex items-center space-x-1 overflow-x-auto no-scrollbar max-w-[220px] sm:max-w-none px-1"></div>

                <button id="next-page" class="px-3.5 py-2 rounded-full bg-white border border-borderSubtle text-textPrimary hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center space-x-1">
                    <span>Next</span>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>

    <footer class="border-t border-borderSubtle bg-creamBg text-textMuted py-8 mt-12">

                <span class="font-extrabold text-textPrimary">Skillry</span>
                <span>© 2026 Skillry.dev</span>

            <div class="flex items-center space-x-4">
                <a href="#feed" class="hover:text-textPrimary">Website Feed</a>
            </div>
        </div>
    </footer>

    <!-- JAVASCRIPT & DATA LOGIC -->
    <script>
        const DATA_URL = './websites.json';
        const ITEMS_PER_PAGE = 10;
        let cardsData = [];
        let currentPage = 1;
        let searchFilter = '';

        function esc(value) {
            return String(value ?? '').replace(/[&<>\"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        async function loadWebsiteData() {
            const container = document.getElementById('cards-container');
            const indicator = document.getElementById('page-indicator');
            container.innerHTML = '<div class="text-center py-12 text-textMuted"><p class="text-sm font-bold">正在加载网站列表...</p></div>';
            indicator.textContent = '加载中…';

            try {
                const response = await fetch(DATA_URL, { cache: 'no-cache' });
                if (!response.ok) throw new Error('HTTP ' + response.status);

                const source = await response.json();

                cardsData = source.map((v, i) => ({
                    id: `site-${i + 1}`,
                    input: v.input || '',
                    url: v.url || '#',
                    title: v.title || '未命名网站',
                    description: v.description || '暂无描述信息...',
                    image: v.image || '',
                    status: v.status || 200
                }));

                renderFeedCards();
            } catch (error) {
                console.error('加载网站数据失败:', error);
                container.innerHTML = `
                                <div class="text-center py-10 px-5 bg-white border-y border-borderSubtle">
                                  <p class="text-sm font-extrabold text-textPrimary">无法加载 websites.json 数据</p>
                                  <p class="text-xs text-textMuted mt-2">提示：由于浏览器的安全限制（CORS），直接双击打开本地 HTML 文件无法读取 JSON。请使用 VS Code 的 Live Server 插件或本地服务器运行。</p>
                                </div>`;
                indicator.textContent = '数据加载失败';
            }
        }

        function getFilteredData() {
            const q = searchFilter.toLowerCase().trim();
            return cardsData.filter(item => {
                return !q || [item.title, item.description, item.input, item.url].join(' ').toLowerCase().includes(q);
            });
        }

        function renderFeedCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            const filtered = getFilteredData();
            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
            currentPage = Math.min(Math.max(1, currentPage), totalPages);

            const pageItems = filtered.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);

            if (!pageItems.length) {
                container.innerHTML = '<div class="text-center py-12 text-textMuted bg-white border-y border-borderSubtle"><p class="text-sm font-bold">没有找到匹配的网站</p></div>';
                renderPagination(0, 0);
                return;
            }

            pageItems.forEach(item => {
                const card = document.createElement('article');
                // 卡片样式：限制整体宽度、居中显示，并添加圆角和细边框
                card.className = 'bg-[#E8E9EB] border border-borderSubtle rounded-2xl w-full max-w-[760px] mx-auto overflow-hidden shadow-sm transition-all';
                card.style.boxShadow = '0 4px 20px rgba(0, 0, 0, 0.04)';

                // 1. 顶部：域名 + 访问链接
                const headerHtml = `
                                <div class="px-5 pt-2.5 pb-0 flex items-center justify-between gap-3">
                                    <div class="flex items-center space-x-2 min-w-0">
                                        <div class="w-7 h-7 shrink-0 rounded-md bg-cardDark text-white flex items-center justify-center text-[10px] font-bold">
                                            ${esc((item.input || 'W').charAt(0).toUpperCase())}
                                        </div>
                                        <span class="text-xs font-bold text-textPrimary truncate">${esc(item.input)}</span>
                                    </div>
                                    <a href="${esc(item.url)}" target="_blank" rel="noopener" class="shrink-0 text-xs text-blue-600 hover:underline font-semibold flex items-center space-x-1">
                                        <span>访问</span>
                                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                                    </a>
                                </div>
                            `;

                // 2. 标题 + 描述
                const bodyHtml = `
                                <div class="px-5 pt-1 pb-2.5 space-y-1">
                                    <h3 class="text-lg sm:text-xl font-extrabold text-blue-600 leading-snug">
                                        <a href="${esc(item.url)}" target="_blank" rel="noopener" class="hover:underline">
                                            ${esc(item.title)}
                                        </a>
                                    </h3>
                                    <p class="text-xs text-textMuted line-clamp-2 leading-relaxed">
                                        ${esc(item.description)}
                                    </p>
                                </div>
                            `;

                // 3. 图片区域
                const imageHtml = item.image ? `
                                <div class="w-full h-64 sm:h-72 bg-cardDark overflow-hidden relative">
                                    <a href="${esc(item.url)}" target="_blank" rel="noopener" class="block w-full h-full">
                                        <img src="${esc(item.image)}" alt="${esc(item.title)}" loading="lazy" class="w-full h-full object-cover object-top hover:opacity-95 transition-opacity" onerror="this.parentElement.parentElement.style.display='none'" />
                                    </a>
                                </div>
                            ` : '';

                card.innerHTML = headerHtml + bodyHtml + imageHtml;
                container.appendChild(card);

            });

            renderPagination(filtered.length, totalPages);
            if (window.lucide) lucide.createIcons();
        }

        function renderPagination(totalCount, totalPages) {
            const nums = document.getElementById('page-numbers');
            const prev = document.getElementById('prev-page');
            const next = document.getElementById('next-page');
            prev.disabled = currentPage <= 1;
            next.disabled = !totalPages || currentPage >= totalPages;
            document.getElementById('page-indicator').innerText = `显示第 ${currentPage} 页 / 共 ${totalPages} 页 (总计 ${totalCount} 个网站)`;

            nums.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
                    const b = document.createElement('button');
                    b.className = i === currentPage ? 'w-8 h-8 rounded-full bg-cardDark text-white text-xs font-bold shadow-sm' : 'w-8 h-8 rounded-full bg-white border border-borderSubtle text-textPrimary hover:bg-gray-100 text-xs font-bold';
                    b.textContent = i;
                    b.onclick = () => { currentPage = i; renderFeedCards(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
                    nums.appendChild(b);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadWebsiteData();
            document.getElementById('main-search').addEventListener('input', e => {
                searchFilter = e.target.value;
                currentPage = 1;
                renderFeedCards();
            });
            document.getElementById('prev-page').addEventListener('click', () => {
                if (currentPage > 1) { currentPage--; renderFeedCards(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
            });
            document.getElementById('next-page').addEventListener('click', () => {
                const pages = Math.ceil(getFilteredData().length / ITEMS_PER_PAGE);
                if (currentPage < pages) { currentPage++; renderFeedCards(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
            });
        });
    </script>
</body>
</html>
