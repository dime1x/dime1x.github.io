
name: Deople Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: deople-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4

      - name: Checkout crawler repository
        uses: actions/checkout@v4
        with:
          repository: dime1x/deople-crawler
          ref: main
          path: crawler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        working-directory: crawler
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Generate websites.json
        working-directory: crawler
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          IMAGE_BASE_URL: https://img.deople.ai
          PUBLISH_BATCH_SIZE: "500"
          PUBLISH_OUTPUT: ../data/websites.json
        run: python -u publisher.py
